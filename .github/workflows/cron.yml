name: cron-jobs

# Calls the LeaderOS cron endpoints (POST /api/cron/<job>, header X-Cron-Secret).
# Every endpoint is idempotent (email_log / per-lead flags), so a re-run or a
# second scheduler calling the same job never sends twice.
#
# Scheduled workflows only run from the default branch (mvpcode).
#
# BACKEND_URL defaults to https://leaderos.de. Today that host is Emergent; after
# the DNS switch it is Railway — no change needed here at cutover.
#
# Pause switch: set the repo variable CRON_PAUSED=true (Settings → Variables)
# to skip all scheduled runs, e.g. during the cutover maintenance window.
# Manual runs (workflow_dispatch) ignore it.
#
# Not scheduled here on purpose:
#   drip-sequence        no-op since Iter 186 (merged into challenge-daily)
#   challenge-daily      runs inside the app (services_challenge_mailer.challenge_mail_loop)
#   webinar-*            webinar-cron.yml (October webinar, fixed dates)
#   event-reminders      needs a reliable 15-min cadence (±15 min window);
#                        GitHub schedules can be hours late
# Manual-only until checked against the old cron-job.org setup (first run may
# send a backlog of mails or downgrade expired masterclass clients):
#   day-10-consultation, course-launch, masterclass-conversion, masterclass-expiry,
#   event-reminders

on:
  schedule:
    - cron: '0 7 * * *'     # daily, 08:00/09:00 Berlin
    - cron: '0 7 1 * *'     # 1st of month, same window
  workflow_dispatch:
    inputs:
      job:
        description: 'Which cron to run'
        required: true
        default: 'installments-due'
        type: choice
        options:
          - installments-due
          - free-video-drip
          - lead-nurture
          - license-nurture
          - trial-reminders
          - video-drip
          - monthly-scorecard
          - day-10-consultation
          - course-launch
          - masterclass-conversion
          - masterclass-expiry
          - event-reminders
          - challenge-daily

env:
  BACKEND_URL: ${{ vars.BACKEND_URL || 'https://leaderos.de' }}

jobs:
  pick:
    if: github.event_name == 'workflow_dispatch' || vars.CRON_PAUSED != 'true'
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.pick.outputs.jobs }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'jobs=["${{ github.event.inputs.job }}"]' >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 7 1 * *" ]; then
            echo 'jobs=["monthly-scorecard"]' >> "$GITHUB_OUTPUT"
          else
            echo 'jobs=["installments-due","free-video-drip","lead-nurture","license-nurture","trial-reminders","video-drip"]' >> "$GITHUB_OUTPUT"
          fi

  run:
    needs: pick
    runs-on: ubuntu-latest
    permissions:
      issues: write
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJson(needs.pick.outputs.jobs) }}
    steps:
      - name: POST /api/cron/${{ matrix.job }}
        env:
          CRON_SHARED_SECRET: ${{ secrets.CRON_SHARED_SECRET }}
          JOB: ${{ matrix.job }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 300 \
               -X POST "${BACKEND_URL%/}/api/cron/${JOB}" \
               -H 'Accept: application/json' \
               ${CRON_SHARED_SECRET:+-H "X-Cron-Secret: ${CRON_SHARED_SECRET}"}

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `cron: ${{ matrix.job }} failed (${new Date().toISOString().slice(0,10)})`,
              labels: ['cron-failure', 'priority:high'],
              body: `Scheduled run of /api/cron/${{ matrix.job }} failed. Backend may be down, the secret may be wrong, or the endpoint regressed.\n\nRun: ${runUrl}\n\nLikely first check: \`curl -sI ${{ env.BACKEND_URL }}/api/health\`.\n\nThis issue was opened automatically; close it once the next scheduled run is green.`
            });
