name: webinar-cron

# Webinar-Reminder + Follow-up für das Live-Webinar (backend/routes/webinar.py).
#
# Termin: WEBINAR_DATE_ISO = 2026-10-29T09:00:00Z (Do 29.10., 10:00 Berlin).
# Wird der Termin verschoben, die Tage unten mitziehen.
#
# Reminder-Fenster im Backend (_REMINDER_WINDOWS):
#   24h → 12–24,5 h vorher  = 28.10. 08:30Z – 21:00Z
#   1h  →  0–2 h vorher     = 29.10. 07:00Z – 09:00Z
# Die Schedules decken nur diese Fenster ab (keine 96 Leerläufe pro Tag
# über Wochen). Doppelte Aufrufe sind unkritisch — jeder Lead hat Flags.
#
# GitHub startet geplante Läufe teils stundenlang verspätet. Das ist nur
# das Backup — primär sollte ein externer Scheduler (cron-job.org, siehe
# docs/ops/CRON_SCHEDULE.md) alle 15 min POST /api/cron/webinar-reminders
# aufrufen.

on:
  schedule:
    - cron: '*/15 8-21 28 10 *'   # 24h-Reminder-Fenster
    - cron: '*/15 6-8 29 10 *'    # 1h-Reminder-Fenster
    - cron: '0 8 30,31 10 *'      # Follow-up am Tag danach (31. = Retry, idempotent)
  workflow_dispatch:
    inputs:
      job:
        description: 'Which webinar cron to run'
        required: true
        default: 'webinar-reminders'
        type: choice
        options:
          - webinar-reminders
          - webinar-followup

env:
  BACKEND_URL: ${{ vars.BACKEND_URL || 'https://leader-os.de' }}

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Pick endpoint
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "job=${{ github.event.inputs.job }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 8 30,31 10 *" ]; then
            echo "job=webinar-followup" >> "$GITHUB_OUTPUT"
          else
            echo "job=webinar-reminders" >> "$GITHUB_OUTPUT"
          fi

      - name: POST /api/cron/${{ steps.pick.outputs.job }}
        env:
          CRON_SHARED_SECRET: ${{ secrets.CRON_SHARED_SECRET }}
          JOB: ${{ steps.pick.outputs.job }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
               -X POST "${BACKEND_URL%/}/api/cron/${JOB}" \
               -H 'Accept: application/json' \
               ${CRON_SHARED_SECRET:+-H "X-Cron-Secret: ${CRON_SHARED_SECRET}"}
          echo

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `cron: ${{ steps.pick.outputs.job }} failed (${new Date().toISOString().slice(0,16)}Z)`,
              labels: ['cron-failure', 'priority:high'],
              body: `Webinar cron failed — registrants may NOT get their reminder/follow-up mail.\n\nRun: ${runUrl}\n\nRe-run manually: Actions → webinar-cron → Run workflow.\n\nThis issue was opened automatically.`
            });
