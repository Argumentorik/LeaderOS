name: codeql
# CodeQL Static Application Security Testing.
# Runs on every PR + weekly on a schedule. Catches OWASP-class issues in
# JS/Python that aren't visible in code review (SQL/NoSQL injection paths,
# prototype-pollution sinks, path traversal, hardcoded secrets in tests, etc).
#
# Findings show up in the Security tab of the repo, and any CRITICAL or HIGH
# severity finding is set as a required check below (see codeql-required job).

on:
  push:
    branches: [mvpcode]
  pull_request:
    branches: [mvpcode]
  schedule:
    # Sundays 06:00 UTC — independent of PR cadence so a stale advisory
    # against an unmodified file still gets re-checked weekly.
    - cron: '0 6 * * 0'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript', 'python']

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # security-extended catches more issues at the cost of a slightly
          # higher false-positive rate · we're a customer-facing platform
          # so the tradeoff is worth it.
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
