name: supabase-advisors

# Catches new ERROR-level Supabase advisors before they get a chance to bite.
# Today (June 3 2026) we fixed a security_definer_view ERROR after the fact —
# it had been live in prod and we only saw it during a manual audit. This
# workflow runs `get_advisors` after every push to mvpcode and fails loudly
# if any new ERROR-level finding appeared.
#
# Requires repo secret SUPABASE_ACCESS_TOKEN (Supabase Personal Access Token
# with read access on the project). Set it once at:
#   GitHub → Settings → Secrets and variables → Actions → New repository secret
#
# WARN/INFO advisors are intentionally ignored — those are tuning hints, not
# launch blockers. ERROR-level ones are real holes.

on:
  push:
    branches: [mvpcode]
  schedule:
    - cron: '0 8 * * *'  # daily 08:00 UTC sanity check, even on quiet days
  workflow_dispatch:

env:
  SUPABASE_PROJECT_REF: srujvjjncrszhaaxepxf

jobs:
  scan:
    name: ERROR-level security advisors must be zero
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: query advisors
        id: query
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN secret not configured — skipping advisor scan. Set it under repo Secrets to enable."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Pull both security + performance; only security ERROR triggers a failure.
          # `advisors` is not a stable public Management API endpoint — when it 404s,
          # log a warning and skip rather than blocking merges. The launch can't sit
          # on a CI gate whose upstream API is undocumented. Re-run manually via the
          # Supabase MCP `get_advisors` tool instead until/if a REST path stabilises.
          http_status=$(curl -sS -o advisors.json -w '%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/advisors?type=security" || echo "000")
          if [ "$http_status" != "200" ]; then
            echo "::warning::Supabase advisors API returned HTTP ${http_status} — skipping. Re-check advisors manually via dashboard or MCP \`get_advisors\`."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: assert no ERROR-level findings
        if: steps.query.outputs.skipped != 'true'
        run: |
          set -euo pipefail
          # advisors.json structure: { "lints": [ { level, name, detail, ... } ] }
          errors=$(jq -r '[.lints[]? | select(.level == "ERROR")] | length' advisors.json)
          if [ "$errors" -gt 0 ]; then
            echo "::error::Supabase reports $errors ERROR-level security advisor(s). Each blocks merge."
            echo
            jq -r '.lints[] | select(.level == "ERROR") | "- \(.name): \(.detail)\n  Fix: \(.remediation // "see Supabase docs")"' advisors.json
            exit 1
          fi
          warn=$(jq -r '[.lints[]? | select(.level == "WARN")] | length' advisors.json)
          echo "0 ERRORs · $warn WARNs (WARN are tuning hints, not blockers)."
