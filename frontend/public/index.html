        <!-- CORE WEB VITALS · real-user perf monitoring → PostHog            -->
        <!-- ════════════════════════════════════════════════════════════════ -->
        <!-- Captures LCP (Largest Contentful Paint), CLS (Cumulative Layout
             Shift), and INP (Interaction to Next Paint) from real visitors
             and fires them as PostHog events. Lets us see actual field data
             instead of just Lighthouse lab numbers. Gated on consent: only
             fires when posthog.__SV (initialized) is truthy. -->
        <script>
          (function(){
            try {
              if (!('PerformanceObserver' in window)) return;
              var send = function(name, value, id){
                try {
                  if (window.posthog && window.posthog.__SV && window.posthog.capture) {
                    window.posthog.capture('web_vital', {
                      metric: name,
                      value: Math.round(value),
                      id: id,
                      path: window.location.pathname,
                    });
                  }
                } catch(_) { /* never block UX */ }
              };
              // LCP · largest above-fold paint
              try {
                new PerformanceObserver(function(list){
                  var entries = list.getEntries();
                  var last = entries[entries.length - 1];
                  if (last) send('LCP', last.renderTime || last.loadTime || last.startTime);
                }).observe({ type: 'largest-contentful-paint', buffered: true });
              } catch(_) {}
              // CLS · layout shift sum
              try {
                var cls = 0;
                new PerformanceObserver(function(list){
                  list.getEntries().forEach(function(e){
                    if (!e.hadRecentInput) cls += e.value;
                  });
                  send('CLS', cls * 1000);
                }).observe({ type: 'layout-shift', buffered: true });
              } catch(_) {}
              // INP · responsiveness (Chrome 96+)
              try {
                new PerformanceObserver(function(list){
                  list.getEntries().forEach(function(e){
                    if (e.duration > 40) send('INP', e.duration);
                  });
                }).observe({ type: 'event', durationThreshold: 40, buffered: true });
              } catch(_) {}
              // TTFB · server response time
              try {
                var nav = performance.getEntriesByType('navigation')[0];
                if (nav) send('TTFB', nav.responseStart);
              } catch(_) {}
            } catch(_) {}
          })();
        </script>
