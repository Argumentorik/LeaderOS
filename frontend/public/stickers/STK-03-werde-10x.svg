      .mono{font-family:'SF Mono','Menlo','Consolas',monospace;font-weight:700;letter-spacing:0.22em;text-transform:uppercase}
      .display{font-family:'Outfit','Inter',system-ui,sans-serif;font-weight:900;font-style:italic;letter-spacing:-0.06em}
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="280" height="280"/>

  <text class="mono ink" x="16" y="22" font-size="8.5">▸ STATEMENT · 003</text>
  <text class="mono ink" text-anchor="end" x="264" y="22" font-size="8.5" opacity="0.45">PRODUKTIVITÄT</text>

  <!-- Massive headline — three lines with lime period -->
  <text class="display ink" x="16" y="88" font-size="48">Werde</text>
  <text class="display ink" x="16" y="156" font-size="116">10<tspan class="lime">×</tspan></text>
  <text class="display ink" x="16" y="200" font-size="36">produktiver<tspan class="lime">.</tspan></text>

  <!-- Bottom W mark -->
  <g transform="translate(16 232)">
