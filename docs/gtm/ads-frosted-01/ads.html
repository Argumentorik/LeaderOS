<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Anzeigen FR01 bis FR04 · Frosted · LeaderOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Anzeigenserie "Frosted" · vier Motive in drei Formaten (4:5, 9:16, 1:1).
   Bildidee: eine Milchglas-Scheibe liegt über einem echten Gesicht, eine Hälfte
   bleibt scharf, die andere verschwimmt. Das ist die Neugier-Mechanik: etwas ist
   da, aber nicht ganz lesbar. Dazu Mono-Schrift in Großbuchstaben, Fein-HUD,
   Limette nur für den Knopf. Foto = das echte Bühnenfoto in drei Farbwelten
   (Eis, Rauch, Warm), kein Stock, kein KI-Gesicht. Fakten nur aus WLAD_CANON.md,
   keine Verknappung, keine Zitate von Wlad (Chat-Texte sind als Beispiel markiert).
   Sichere Zonen 9:16 (Stories/Reels): oben 270 px, unten 480 px frei. */
:root{--lime:#bfff00;--ink:#0a0c10;--bg:#050a12;
  --sans:'Inter Display','Inter',system-ui,sans-serif;--txt:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;--disp:'Outfit',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#111}
.sheet{position:relative;overflow:hidden;background:var(--bg);color:#fff;font-family:var(--txt);-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.sheet>*{position:absolute}
.fill{left:0;top:0;width:100%;height:100%}
.ph img{position:absolute;display:block;max-width:none}
.grain{left:0;top:0;width:100%;height:100%;background:url(../social-kit/build/grain.png);background-size:256px 256px;mix-blend-mode:overlay;opacity:.42;pointer-events:none}
.vig{left:0;top:0;width:100%;height:100%;background:radial-gradient(120% 90% at 60% 40%,transparent 50%,rgba(1,3,8,.6) 100%)}

/* Milchglas-Scheibe */
.pane{top:0;height:100%;-webkit-backdrop-filter:blur(40px) saturate(1.05) brightness(1.1);backdrop-filter:blur(40px) saturate(1.05) brightness(1.1)}
.pane.ice{background:linear-gradient(90deg,rgba(172,204,236,.20),rgba(198,224,246,.34));box-shadow:inset -2px 0 0 rgba(255,255,255,.62),inset -9px 0 14px -8px rgba(255,255,255,.22),24px 0 70px -8px rgba(0,8,24,.42)}
.pane.warm{background:linear-gradient(90deg,rgba(255,206,164,.16),rgba(255,224,196,.30));box-shadow:inset -2px 0 0 rgba(255,244,230,.6),inset -9px 0 14px -8px rgba(255,240,220,.22),24px 0 70px -8px rgba(30,6,0,.45)}
.pane.lime{background:linear-gradient(90deg,rgba(214,255,130,.10),rgba(224,255,160,.22));box-shadow:inset -2px 0 0 rgba(235,255,190,.6),inset -9px 0 14px -8px rgba(235,255,200,.2),24px 0 70px -8px rgba(0,16,4,.5)}
.pane-grain{top:0;height:100%;background:url(../social-kit/build/grain.png);background-size:256px 256px;mix-blend-mode:soft-light;opacity:.42;pointer-events:none}

/* Schrift */
.mh{font-family:var(--mono);font-weight:500;letter-spacing:.24em;text-transform:uppercase;line-height:1.3;text-shadow:0 0 34px rgba(150,200,255,.45),0 2px 18px rgba(0,0,0,.35);margin-right:-.24em}
.sh{font-family:var(--sans);font-weight:300;letter-spacing:-.035em;line-height:1.0;text-shadow:0 2px 40px rgba(0,0,0,.4)}
.sub{font-family:var(--mono);font-weight:400;letter-spacing:.04em;line-height:1.55;color:rgba(255,255,255,.84);text-shadow:0 1px 14px rgba(0,0,0,.5)}
.sub.sn{font-family:var(--txt);letter-spacing:-.01em;line-height:1.38}
.info{font:500 21px/1.4 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.72);text-shadow:0 1px 12px rgba(0,0,0,.5)}
.tag{font:500 20px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.74);white-space:nowrap}
.bt{display:block;width:48px;height:48px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
.list{font-family:var(--mono);font-weight:400;color:rgba(255,255,255,.92);text-shadow:0 1px 12px rgba(0,0,0,.35)}
.list div{display:flex;gap:.9em;align-items:baseline;letter-spacing:.02em}
.list i{font-style:normal;font-size:.62em;letter-spacing:.16em;color:var(--lime);opacity:.9}

/* Bedienelemente */
.stack{display:flex;flex-direction:column;align-items:center;text-align:center}
.cta{display:inline-flex;align-items:center;gap:22px;background:var(--lime);color:var(--ink);font-family:var(--sans);font-weight:600;letter-spacing:-.02em;border-radius:999px;box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 0 0 1.5px rgba(255,255,255,.22),0 24px 70px rgba(191,255,0,.32),0 12px 30px rgba(0,0,0,.4)}
.cta .ar{display:flex;align-items:center;justify-content:center;background:var(--ink);border-radius:50%}
.cta svg{width:46%;height:46%;fill:none;stroke:var(--lime);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-flex;flex-direction:column;gap:6px;padding:16px 24px 17px;border-radius:26px;color:#fff;background:linear-gradient(165deg,rgba(255,255,255,.2),rgba(255,255,255,.05)),rgba(8,14,26,.42);-webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 0 0 1.5px rgba(255,255,255,.14),0 24px 60px rgba(0,0,0,.45)}
.chip b{font:500 22px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase}
.chip span{font:400 18px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--lime)}
.bub{padding:20px 26px 22px;border-radius:30px 30px 30px 8px;font:400 27px/1.28 var(--txt);letter-spacing:-.015em;background:linear-gradient(165deg,rgba(255,255,255,.22),rgba(255,255,255,.06)),rgba(10,18,12,.4);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 0 0 1.5px rgba(255,255,255,.14),0 20px 50px rgba(0,0,0,.4)}
.bub.u{background:var(--lime);color:var(--ink);font-weight:500;border-radius:30px 30px 8px 30px;margin-left:auto}
.bub.l{background:rgba(255,255,255,.92);color:var(--ink)}
.bub .k{display:block;margin-bottom:8px;font:500 14px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;opacity:.62}
</style>
</head>
<body>
<div id="sheet" class="sheet"></div>
<script src="../social-kit/kit.js"></script>
<script>
const B = '../social-kit/build/';
const FORMATS = { '4x5': [1080, 1350], '9x16': [1080, 1920], '1x1': [1080, 1080] };
const FACE = { x: 770, y: 232 };                       // Gesichtsmitte im Foto (Quellpixel)
const SRC = { ice: 'stage-ice.jpg', smoke: 'stage-smoke.jpg', warm: 'stage.jpg' };
const ARROW = '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

// Maße je Format: Foto-Maßstab k und Gesichtsmitte (fx, fy), Scheibe, Textblock (bottom = Abstand zum unteren Rand)
const L = {
  '4x5':  { W: 1080, H: 1350, k: 1.5,  fy: 410, seam: 560, bottom: 70,  listY: 330, listGap: 30, listSize: 25, hs: 62, ss: 26, ch: 96,  cs: 34, gap: 26, sub: 1, brandY: 64 },
  '9x16': { W: 1080, H: 1920, k: 1.6,  fy: 700, seam: 540, bottom: 500, listY: 560, listGap: 46, listSize: 26, hs: 70, ss: 25, ch: 104, cs: 37, gap: 34, sub: 0, brandY: 290 },
  '1x1':  { W: 1080, H: 1080, k: 1.15, fy: 320, seam: 540, bottom: 60,  listY: 230, listGap: 22, listSize: 23, hs: 50, ss: 0,  ch: 88,  cs: 31, gap: 22, sub: 0, brandY: 56 },
};

const photo = (grade, k, fx, fy, fade) => {
  const top = fy - FACE.y * k;
  const mask = fade ? `-webkit-mask-image:linear-gradient(to bottom,transparent ${top}px,#000 ${top + fade}px);mask-image:linear-gradient(to bottom,transparent ${top}px,#000 ${top + fade}px)` : '';
  return `<div class="fill ph" style="${mask}"><img src="${B}${SRC[grade]}" style="left:${fx - FACE.x * k}px;top:${top}px;width:${1342 * k}px;height:${1076 * k}px" alt=""></div>`;
};
const brand = (y, label, right) => `<div style="left:72px;top:${y}px">${K.TILE.replace('class="bt"', 'class="bt"')}</div><div class="tag" style="left:136px;top:${y + 16}px">${label}</div>${right ? `<div class="tag" style="right:72px;top:${y + 16}px;color:#fff"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--lime);margin-right:14px;box-shadow:0 0 16px var(--lime)"></span>${right}</div>` : ''}`;
const vlabel = (l, text) => `<div class="tag" style="left:30px;top:${l.H / 2 + 150}px;transform:rotate(-90deg);transform-origin:0 0;font-size:14px;letter-spacing:.34em;color:rgba(255,255,255,.55)">${text}</div>`;
const dots = (l, active = 0) => `<div style="right:40px;top:${l.H / 2 - 40}px;display:flex;flex-direction:column;gap:18px">${[0, 1, 2, 3].map((i) => `<i style="display:block;width:8px;height:8px;border-radius:50%;background:${i === active ? 'var(--lime)' : 'rgba(255,255,255,.35)'}"></i>`).join('')}</div>`;
const cta = (l, label) => `<div class="cta" style="height:${l.ch}px;padding:0 ${l.ch * .2}px 0 ${l.ch * .5}px;font-size:${l.cs}px">${label}<span class="ar" style="width:${l.ch * .66}px;height:${l.ch * .66}px">${ARROW}</span></div>`;
const list = (l, items, x) => `<div class="list" style="left:${x}px;top:${l.listY}px;font-size:${l.listSize}px">${items.map((t, i) => `<div style="margin-bottom:${l.listGap}px"><i>${String(i + 1).padStart(2, '0')}</i>${t}</div>`).join('')}</div>`;
const scrim = (a = .92) => `<div class="fill" style="background:linear-gradient(to top,rgba(2,6,14,${a}) 0%,rgba(2,6,14,${a * .62}) 26%,rgba(2,6,14,0) 54%)"></div>`;
const topInfo = (l, f, text) => f === '9x16' ? `<div class="info" style="left:72px;top:${l.brandY + 78}px">${text}</div>` : '';
const finish = (l, x0, x1, tint) => `<div class="pane-grain" style="left:${x0}px;width:${x1 - x0}px"></div>`;

const ADS = [
  // FR01 · Webinar · Neugier-Lücke "Hinter dem Nein" · Eis, Scheibe links
  { id: 'FR01', slug: 'hinter-dem-nein', title: 'Was hinter dem Nein steckt', dest: 'webinar',
    html: (f) => { const l = L[f]; const lines = ['WAS HINTER', 'DEM NEIN', 'STECKT'];
      return `
      ${photo('ice', l.k, l.seam, l.fy, 150)}
      <div class="fill" style="background:radial-gradient(60% 40% at 82% 8%,rgba(160,200,255,.28),rgba(160,200,255,0))"></div>
      <div class="vig"></div>
      <div class="pane ice" style="left:0;width:${l.seam}px"></div>${finish(l, 0, l.seam)}
      ${scrim()}
      ${brand(l.brandY, 'LeaderOS', 'Live-Webinar')}${topInfo(l, f, 'Do 26.11. · 10 Uhr · keine Aufzeichnung')}
      ${vlabel(l, 'Webinar · 26.11.2026 · 10:00')}${dots(l)}
      ${list(l, ['Haben wir schon probiert.', 'Dafür ist kein Budget da.', 'Das passt gerade nicht.', 'Später.', 'Bringt nichts.'].slice(0, f === '1x1' ? 4 : 5), 72)}
      <div class="chip" style="right:72px;top:${l.brandY + (f === '9x16' ? 130 : 96)}px"><b>Wlad Jachtchenko</b><span>3× SPIEGEL-Bestseller</span></div>
      <div class="stack" style="left:0;width:100%;bottom:${l.bottom}px;gap:${l.gap}px">
        <div class="mh" style="font-size:${l.hs}px">${lines.join('<br>')}</div>
        ${l.sub ? `<div class="sub" style="font-size:${l.ss}px;width:640px">Hinter einem Nein steckt fast immer ein Interesse. Wie du es findest, zeigt Wlad Jachtchenko live.</div>` : ''}
        ${cta(l, 'Kostenlos anmelden')}
        ${f === '9x16' ? '' : `<div class="info">Do 26.11. · 10 Uhr · keine Aufzeichnung</div>`}
      </div>
      <div class="grain"></div>`; } },
  // FR02 · Webinar · Autorität "Bessere Gespräche" · Rauch, Linse
  { id: 'FR02', slug: 'bessere-gespraeche', title: 'Bessere Gespräche', dest: 'webinar',
    html: (f) => { const l = L[f]; const g = { '4x5': { cx: 590, cy: 450, r: 400, k: 1.3, fy: 440 }, '9x16': { cx: 560, cy: 780, r: 440, k: 1.4, fy: 770 }, '1x1': { cx: 600, cy: 380, r: 340, k: 1.0, fy: 365 } }[f];
      return `
      <div class="fill" style="background:#0d0c0c"></div>
      <div class="fill ph" style="filter:blur(34px) brightness(2.1) contrast(.62) saturate(.5)"><img src="${B}${SRC.smoke}" style="left:${l.W / 2 - FACE.x * 2.4}px;top:${l.H * .42 - FACE.y * 2.4}px;width:${1342 * 2.4}px;height:${1076 * 2.4}px" alt=""></div>
      <div class="fill" style="background:radial-gradient(70% 45% at 14% 8%,rgba(255,255,255,.34),rgba(255,255,255,0) 70%),linear-gradient(180deg,rgba(214,208,200,.30),rgba(150,144,138,.20) 60%,rgba(40,36,34,.6))"></div>
      ${scrim(.8)}
      <div class="fill" style="clip-path:circle(${g.r}px at ${g.cx}px ${g.cy}px);background:#0a0909">${photo('smoke', g.k, g.cx - 10, g.fy, 150)}</div>
      <div class="fill" style="left:${g.cx - g.r}px;top:${g.cy - g.r}px;width:${g.r * 2}px;height:${g.r * 2}px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.78),0 0 0 14px rgba(255,255,255,.1),0 0 120px rgba(255,255,255,.22),inset 0 0 90px rgba(0,0,0,.5),inset 0 -150px 110px -70px rgba(0,0,0,.55);background:radial-gradient(90% 90% at 24% 14%,rgba(255,255,255,.2),rgba(255,255,255,0) 42%)"></div>
      <div class="vig"></div>
      ${[[-1, -1], [1, -1], [-1, 1], [1, 1]].map(([sx, sy]) => `<i style="left:${g.cx + sx * 130 - (sx > 0 ? 0 : 0) - 14}px;top:${g.cy - 20 + sy * 190 - 14}px;width:28px;height:28px;border:2.5px solid rgba(255,255,255,.85);border-${sx > 0 ? 'left' : 'right'}:0;border-${sy > 0 ? 'top' : 'bottom'}:0"></i>`).join('')}
      ${brand(l.brandY, 'LeaderOS', 'Live-Webinar')}${topInfo(l, f, 'Do 26.11. · 10 Uhr · keine Aufzeichnung')}
      ${vlabel(l, 'Webinar · 26.11.2026 · 10:00')}${dots(l, 1)}
      <div class="stack" style="left:0;width:100%;bottom:${l.bottom}px;gap:${l.gap}px">
        <div class="sh" style="font-size:${l.hs * 1.8}px">Bessere<br>Gespräche.</div>
        ${l.sub ? `<div class="sub sn" style="font-size:${l.ss + 8}px;width:700px">Live-Webinar mit Wlad Jachtchenko.<br>90 Minuten, Q&amp;A, kostenlos.</div>` : ''}
        ${cta(l, 'Kostenlos anmelden')}
        ${f === '9x16' ? '' : `<div class="info">Do 26.11. · 10 Uhr · keine Aufzeichnung</div>`}
      </div>
      <div class="chip" style="left:72px;top:${f === '9x16' ? 1250 : f === '1x1' ? 560 : 640}px;display:none"><b>Wlad Jachtchenko</b><span>3× SPIEGEL-Bestseller</span></div>
      <div class="grain"></div>`; } },
  // FR03 · Leader-Check · Emotionale Intelligenz · Warm, Scheibe links
  { id: 'FR03', slug: 'wie-gut-liest-du-menschen', title: 'Wie gut liest du Menschen?', dest: 'check',
    html: (f) => { const l = L[f]; const lines = ['WIE GUT', 'LIEST DU', 'MENSCHEN?'];
      return `
      ${photo('warm', l.k, l.seam, l.fy, 150)}
      <div class="fill" style="background:radial-gradient(60% 40% at 82% 8%,rgba(255,200,140,.3),rgba(255,200,140,0))"></div>
      <div class="vig"></div>
      <div class="pane warm" style="left:0;width:${l.seam}px"></div>${finish(l, 0, l.seam)}
      ${scrim()}
      ${brand(l.brandY, 'LeaderOS · Leader-Check', '10 Min')}${topInfo(l, f, '10 Min · kostenlos · keine Kreditkarte')}
      ${vlabel(l, 'Emotionale Intelligenz')}${dots(l, 2)}
      ${list(l, ['Frust', 'Zurückhaltung', 'Zweifel', 'Ärger', 'Begeisterung'].slice(0, f === '1x1' ? 4 : 5), 72)}
      <div class="chip" style="right:72px;top:${l.brandY + (f === '9x16' ? 130 : 96)}px"><b>Methodik von</b><span>Wlad Jachtchenko</span></div>
      <div class="stack" style="left:0;width:100%;bottom:${l.bottom}px;gap:${l.gap}px">
        <div class="mh" style="font-size:${l.hs}px">${lines.join('<br>')}</div>
        ${l.sub ? `<div class="sub" style="font-size:${l.ss}px;width:660px">Der Leader-Check misst KI-Readiness, Rhetorik und Emotionale Intelligenz. 10 Minuten, kostenlos.</div>` : ''}
        ${cta(l, 'Check starten')}
        ${f === '9x16' ? '' : `<div class="info">10 Min · kostenlos · keine Kreditkarte</div>`}
      </div>
      <div class="grain"></div>`; } },
  // FR04 · KI-Führungskraft (k=gespraech) · "Proben statt hoffen" · Limette, Scheibe mit Chat, WladBot
  { id: 'FR04', slug: 'proben-statt-hoffen', title: 'Proben statt hoffen', dest: 'ki',
    html: (f) => { const l = L[f]; const m = { '4x5': { w: 980, top: 230 }, '9x16': { w: 1040, top: 470 }, '1x1': { w: 800, top: 120 } }[f];
      return `
      ${K.amb('amb-lime', 'tl', 'background-size:190% auto')}
      <div class="fill" style="background:linear-gradient(180deg,rgba(2,10,6,.25),rgba(2,10,6,.7))"></div>
      <div class="fill" style="background:radial-gradient(46% 38% at 62% ${f === '9x16' ? 46 : f === '1x1' ? 40 : 38}%,rgba(191,255,0,.38),rgba(191,255,0,0))"></div>
      <img src="${B}mascot.png" style="left:${l.seam - m.w / 2}px;top:${m.top}px;width:${m.w}px;filter:drop-shadow(0 40px 70px rgba(0,0,0,.6));-webkit-mask-image:linear-gradient(to bottom,#000 60%,transparent 96%);mask-image:linear-gradient(to bottom,#000 60%,transparent 96%)" alt="">
      <div class="vig"></div>
      <div class="pane lime" style="left:0;width:${l.seam}px"></div>${finish(l, 0, l.seam)}
      ${scrim(.7)}
      ${brand(l.brandY, 'LeaderOS · WladBot', 'Live-Webinar')}${topInfo(l, f, 'Live-Webinar · Do 26.11. · 10 Uhr')}
      ${vlabel(l, 'Rollenspiel · Beispiel')}${dots(l, 3)}
      <div style="left:72px;top:${l.listY - (f === '1x1' ? 20 : 40)}px;width:${l.seam - 72 - 40}px;display:flex;flex-direction:column;gap:${f === '9x16' ? 28 : 18}px">
        <div class="bub"><span class="k">Chef</span>Dafür ist kein Budget da.</div>
        <div class="bub u"><span class="k">Du</span>Was müsste passieren, damit es im nächsten Quartal geht?</div>
        ${f === '1x1' ? '' : `<div class="bub l"><span class="k">WladBot · wertet</span><b style="font-weight:600">Stark.</b> Rückfrage-Technik.</div>`}
      </div>
      <div class="stack" style="left:0;width:100%;bottom:${l.bottom}px;gap:${l.gap}px">
        <div class="sh" style="font-size:${l.hs * 1.6}px">Proben statt<br>hoffen.</div>
        ${l.sub ? `<div class="sub sn" style="font-size:${l.ss + 6}px;width:680px">Spiel das schwierige Gespräch vorher durch. Mit einem KI-Coach, der zurückredet.</div>` : ''}
        ${cta(l, 'Kostenlos anmelden')}
        ${f === '9x16' ? '' : `<div class="info">Live-Webinar · Do 26.11. · 10 Uhr</div>`}
      </div>
      <div class="grain"></div>`; } },
];
window.ADS = ADS.map((a) => ({ id: a.id, slug: a.slug, title: a.title, dest: a.dest, formats: Object.keys(FORMATS) }));

const q = new URLSearchParams(location.search);
const ad = ADS.find((a) => a.id === (q.get('a') || 'FR01'));
const fmt = q.get('f') || '4x5';
const sheet = document.getElementById('sheet');
sheet.style.width = FORMATS[fmt][0] + 'px';
sheet.style.height = FORMATS[fmt][1] + 'px';
sheet.innerHTML = ad.html(fmt);
</script>
</body>
</html>
