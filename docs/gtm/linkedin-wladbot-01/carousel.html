<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Karussells W01 bis W03 · WLAD AI · LeaderOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@500&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../social-kit/kit.css">
<style>
/* W-Serie "WLAD AI" · drei Karussells à fünf Folien · 1080×1350 (4:5), für LinkedIn
   (PDF) und Instagram. Bildwelt und Bausteine: ../social-kit (Bühnenfoto, Glas,
   Maskottchen). Jedes Karussell weckt Neugier mit einem Fall, den alle kennen,
   und löst ihn mit einem Canon-Framework auf (Feedbackformel, SEXIER,
   Rückfrage-Technik). Die letzte Folie ist der Beta-Zugang (QR bei LinkedIn,
   "Link in Bio" bei Instagram). Chat-Antworten sind Beispiele und so
   gekennzeichnet; sie sind keine Zitate von Wlad. Kein Name, keine Credentials,
   kein Termin. */
.rowc{display:flex;align-items:center;gap:30px;padding:0 38px 0 24px;height:124px;border-radius:40px}
.badge{flex:none;width:76px;height:76px;border-radius:24px;background:var(--lime);color:var(--ink);font:700 46px/76px var(--disp);text-align:center}
.rowc b{display:block;font:600 36px/1.1 var(--txt);letter-spacing:-.02em}
.rowc span.s{display:block;margin-top:6px;font:400 28px/1.25 var(--txt);color:rgba(255,255,255,.66)}
.doc{padding:20px 40px;border-radius:52px}
.doc .r{display:flex;align-items:center;gap:30px;padding:24px 0;border-bottom:1.5px solid rgba(10,12,16,.1);font:500 38px/1.2 var(--txt);letter-spacing:-.022em}
.doc .r:last-child{border-bottom:0}
.doc .r .badge{width:68px;height:68px;font-size:40px;line-height:68px;border-radius:21px}
.mp{display:flex;align-items:center;justify-content:center;width:144px;height:108px;border-radius:34px;font:700 54px var(--disp);color:rgba(255,255,255,.8)}
.mp.on{background:var(--lime);color:var(--ink);box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 24px 60px rgba(191,255,0,.28),0 18px 40px rgba(0,0,0,.4)}
.opt{display:flex;align-items:center;gap:34px;padding:34px 46px 34px 34px;border-radius:56px}
.opt .l{flex:none;width:96px;height:96px;border-radius:50%;background:var(--ink);color:#fff;font:700 52px/96px var(--disp);text-align:center}
.opt .t{font:500 46px/1.16 var(--txt);letter-spacing:-.025em}
.opt .t small{display:block;margin-top:14px;font:400 31px/1.28 var(--txt);letter-spacing:-.01em;opacity:.78}
.opt.no{opacity:.84}.opt.no .l{background:rgba(255,255,255,.16)}.opt.no .t>span{text-decoration:line-through;text-decoration-thickness:2.5px;text-decoration-color:rgba(255,255,255,.55)}
.opt.yes .l{background:var(--lime);color:var(--ink)}
.opt.yes{box-shadow:inset 0 2px 0 rgba(255,255,255,.95),0 0 0 4px var(--lime),0 34px 90px rgba(191,255,0,.22),0 6px 16px rgba(0,0,0,.3)}
.verd{display:inline-block;margin-right:12px;padding:5px 16px 6px;border-radius:999px;font:600 25px/1.2 var(--txt);letter-spacing:0;vertical-align:2px;background:rgba(255,255,255,.18);color:#fff}
.opt.yes .verd{background:var(--ink);color:var(--lime)}
.herocard{padding:34px 40px 38px;border-radius:48px}
.herocard .k{font:500 20px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--lime)}
.herocard .n{margin-top:14px;font:700 156px/.95 var(--disp);letter-spacing:-.05em;color:var(--lime)}
.herocard .a{margin-top:12px;font:600 38px/1.15 var(--txt);letter-spacing:-.02em}
.herocard .b{margin-top:8px;font:400 28px/1.3 var(--txt);color:rgba(255,255,255,.64)}
</style>
</head>
<body>
<div id="sheet" class="sheet"></div>
<script src="../social-kit/kit.js"></script>
<script>
// Die Zahl der Plätze muss der echten Begrenzung entsprechen: die Aufnahme
// stoppt bei dieser Zahl (technisch durchgesetzt), sonst ist die Knappheit
// erfunden und verstößt gegen docs/gtm/WEBINAR_FUNNEL.md. 150 laut Mert
// (04.11.2026); LI-05 und linkedin-carousels-01 nennen noch 50.
const SEATS = 150;

const HEAD = (top, html, size = 100, extra = '') => `<div class="hd" style="left:72px;top:${top}px;width:936px;font-size:${size}px;${extra}">${html}</div>`;
const ph = (sx, sy, sw, l, t, w, h) => K.photo(sx, sy, sw, l, t, w, h, 'border-radius:56px;box-shadow:0 40px 90px rgba(0,0,0,.6),0 0 0 1.5px rgba(255,255,255,.14)');

// Letzte Folie: Beta-Zugang. ig = Instagram ("Link in Bio" statt QR), seats = 0 ohne Platzzahl
const cta = (s, c, o) => `
  ${K.amb('amb-lime', 'bl', 'background-size:175% auto')}
  ${K.dim(0.25, 0.6)}
  <div class="sk" style="left:-200px;top:700px;width:820px;height:560px;background:radial-gradient(closest-side,rgba(191,255,0,.5),rgba(191,255,0,0))"></div>
  ${K.vig}
  ${K.mascot('left:-190px;top:520px;width:880px;filter:drop-shadow(0 44px 70px rgba(0,0,0,.6))')}
  ${K.chrome(c.tag)}
  ${HEAD(170, 'Frag WLAD AI<br><span class="lm">selbst.</span>', 118)}
  ${K.note('left:72px;top:430px;width:440px', s.bubbleText)}
  <div class="g d herocard" style="left:560px;top:440px;width:448px">
    <div class="k">${o.seats > 0 ? 'Beta · kostenlos' : 'Beta · kostenlos'}</div>
    <div class="n">${o.seats > 0 ? o.seats : 'Offen'}</div>
    <div class="a">${o.seats > 0 ? 'Plätze.' : 'Jetzt starten.'}</div>
    <div class="b">${o.seats > 0 ? 'Aufnahme stoppt bei ' + o.seats + '.' : 'Zugang ohne Warteliste.'}</div>
  </div>
  ${o.ig
    ? `<div class="g d" style="left:560px;top:830px;width:448px;height:250px;padding:44px 44px;border-radius:48px">
         <div style="font:600 56px/1.04 var(--txt);letter-spacing:-.03em">Link<br>in Bio</div>
         <div class="g l" style="position:absolute;right:36px;bottom:36px;width:112px;height:112px;border-radius:50%;display:flex;align-items:center;justify-content:center"><span class="send" style="background:none;width:auto;height:auto">${K.ARROW_UR}</span></div>
       </div>`
    : `<div class="g w" style="left:608px;top:826px;width:400px;padding:35px;border-radius:44px"><img src="${c.qr}" style="display:block;width:330px;height:330px" alt="QR-Code zum Beta-Zugang"></div>
       <div class="tag" style="left:560px;top:1258px;width:448px;text-align:right">oder Link im ersten Kommentar</div>`}
  ${K.grain}`;

const CAROUSELS = [
  // ───────── W01 · Der Teamlead, der alles abblockt ─────────
  { id: 'W01', slug: 'teamlead-blockt', title: 'Dein Teamlead blockt jeden Vorschlag ab.', qr: '../social-kit/build/qr-w01.svg', tag: 'WLAD AI <b>·</b> Feedback',
    slides: [
      // 1 · Foto in voller Höhe, Überschrift darunter, Anker an der offenen Hand
      () => `
        ${K.photo(330, 0, 820, 260, 0, 820, 1076)}
        <div style="left:260px;top:0;width:90px;height:1076px;background:linear-gradient(to right,var(--bg),rgba(6,8,12,0))"></div>
        <div style="left:0;top:830px;width:1080px;height:246px;background:linear-gradient(to bottom,rgba(6,8,12,0),var(--bg))"></div>
        ${K.vig}
        ${K.chrome('WLAD AI <b>·</b> Feedback')}
        ${K.note('left:72px;top:176px;width:500px', 'Ich stelle dir erst eine <b>Gegenfrage.</b>')}
        ${K.anchors([{ x: 375, y: 775, cx: 288, cy: 775, side: 'l', label: 'Gegenfrage', d: true }])}
        ${HEAD(1000, '<span class="m">Dein Teamlead</span><br>blockt jeden<br>Vorschlag ab.', 96)}
        ${K.rb(880, 1112, 'wischen')}
        ${K.grain}`,
      // 2 · Chat
      () => `
        ${K.amb('amb-warm', 'tr')}
        ${K.dim(0.12, 0.45)}${K.vig}
        ${K.chrome('WLAD AI <b>·</b> Feedback')}
        <div style="left:72px;top:176px;width:936px;display:flex;align-items:center;gap:24px">${K.av('width:96px;height:96px')}<span style="font:600 46px var(--txt);letter-spacing:-.02em">WLAD AI</span><span class="g chip" style="margin-left:auto;font-size:24px;padding:12px 24px">Beispiel</span></div>
        <div style="left:72px;top:340px;width:936px;display:flex;flex-direction:column;gap:28px">
          <div class="bub u" style="align-self:flex-end;max-width:84%">Er sagt bei jeder Idee: „Haben wir schon probiert.“</div>
          <div class="bub u" style="align-self:flex-end">Wie überzeuge ich ihn?</div>
          <div class="g bub b" style="align-self:flex-start;max-width:97%"><span class="big">Falsche Frage.</span><span class="sub">Besser: <b>Was verliert er, wenn du recht hast?</b></span></div>
        </div>
        <div class="g d input" style="left:72px;top:1146px;width:936px;height:116px;border-radius:58px">Frag mich …<span class="send">${K.ARROW_UP}</span></div>
        ${K.grain}`,
      // 3 · Aussage, darunter die Hände im Foto, Mitteilung über dem Kartenrand
      () => `
        ${K.amb('amb-cool', 'br')}
        ${K.dim(0.12, 0.45)}${K.vig}
        ${K.chrome('WLAD AI <b>·</b> Feedback')}
        ${HEAD(170, '<span class="m">Hinter einem Nein<br>steckt fast immer</span><br>ein Interesse.', 100)}
        ${ph(300, 520, 740, 72, 540, 936, 640)}
        ${K.note('left:150px;top:1040px;width:760px', 'Oft: Risiko, Mehrarbeit oder Gesichtsverlust. <b>Frag danach, nicht nach Zustimmung.</b>')}
        ${K.grain}`,
      // 4 · Der erste Satz in drei Teilen
      () => `
        ${K.amb('amb-warm', 'tr')}
        ${K.dim(0.12, 0.45)}${K.vig}
        ${K.chrome('WLAD AI <b>·</b> Feedback')}
        ${HEAD(170, '<span class="m">Dein erster</span><br>Satz.', 100)}
        <div style="left:72px;top:440px;width:936px;display:flex;flex-direction:column;gap:22px">
          <div class="g d" style="padding:34px 42px 38px;border-radius:44px"><div class="tag" style="color:var(--lime)">01 · Beobachtung</div><div style="margin-top:16px;font:400 42px/1.2 var(--txt);letter-spacing:-.025em">Mir ist aufgefallen, dass meine Vorschläge im Meeting sofort abgelehnt werden.</div></div>
          <div class="g d" style="padding:34px 42px 38px;border-radius:44px"><div class="tag" style="color:var(--lime)">02 · Wirkung</div><div style="margin-top:16px;font:400 42px/1.2 var(--txt);letter-spacing:-.025em">Das kostet uns Ideen.</div></div>
          <div class="g l" style="padding:34px 42px 38px;border-radius:44px"><div class="tag" style="color:rgba(10,12,16,.62)">03 · Wunsch</div><div style="margin-top:16px;font:500 42px/1.2 var(--txt);letter-spacing:-.025em">Ich wünsche mir, dass wir eine davon gemeinsam durchspielen.</div></div>
        </div>
        <div style="left:72px;top:1200px;width:936px;font:400 32px/1.3 var(--txt);color:rgba(255,255,255,.62);letter-spacing:-.01em">Nie „du bist …“, immer „mir ist aufgefallen …“</div>
        ${K.grain}`,
      (c, o) => cta({ bubbleText: 'Stell mir <b>deine</b> Frage.' }, c, o),
    ] },
  // ───────── W02 · SEXIER: das Argument wird zerlegt ─────────
  { id: 'W02', slug: 'argument-zerlegt', title: 'WLAD AI zerlegt dein Argument.', qr: '../social-kit/build/qr-w02.svg', tag: 'WLAD AI <b>·</b> Argument',
    slides: [
      // 1 · Aussage wird zerlegt
      () => `
        ${K.amb('amb-cool', 'br')}
        ${K.dim(0.12, 0.45)}
        <div class="sk" style="left:-260px;top:880px;width:820px;height:560px;background:radial-gradient(closest-side,rgba(191,255,0,.28),rgba(191,255,0,0))"></div>
        ${K.vig}
        ${K.chrome('WLAD AI <b>·</b> Argument')}
        ${HEAD(170, '<span class="m">WLAD AI zerlegt</span><br>dein Argument.', 108)}
        <div class="g d ghost" style="left:640px;top:440px;width:520px;height:380px;transform:rotate(7deg)"></div>
        <div class="g" style="left:72px;top:500px;width:936px;height:340px;border-radius:56px"></div>
        <div style="left:72px;top:500px;width:936px;height:340px;display:flex;flex-direction:column;justify-content:center;padding:0 64px;font:italic 400 96px/1.1 var(--serif);color:#0b0d12;white-space:nowrap">„Wir müssen das<br>Projekt stoppen.“</div>
        <div style="left:34px;top:668px;width:1012px;height:4px;background:var(--lime);box-shadow:0 0 28px rgba(191,255,0,.8)"></div>
        <div style="left:24px;top:656px;width:28px;height:28px;border-radius:50%;background:var(--lime)"></div>
        <div style="left:1028px;top:656px;width:28px;height:28px;border-radius:50%;background:var(--lime)"></div>
        ${K.mascot('left:-150px;top:800px;width:700px;filter:drop-shadow(0 40px 60px rgba(0,0,0,.6))')}
        ${K.note('left:330px;top:880px;width:678px', 'Das ist ein Satz. <b>Kein Argument.</b>')}
        ${K.rb(880, 1112, 'wischen')}
        ${K.grain}`,
      // 2 · Schritt 1 von 6
      () => `
        ${K.amb('amb-warm', 'tr')}
        ${K.dim(0.12, 0.45)}${K.vig}
        ${K.chrome('WLAD AI <b>·</b> Argument')}
        ${HEAD(170, 'Schritt 1<br><span class="m">von 6.</span>', 108)}
        <div class="g d" style="left:72px;top:470px;width:936px;padding:46px 54px 50px;border-radius:52px;font:400 74px/1.06 var(--sans);letter-spacing:-.04em">„Wir müssen das Projekt stoppen.“</div>
        <div style="left:72px;top:760px;width:936px;display:flex;gap:14px">${['S', 'E', 'X', 'I', 'E', 'R'].map((l, i) => `<div class="g d mp${i < 1 ? ' on' : ''}" style="border-radius:34px">${l}</div>`).join('')}</div>
        ${K.mascot('right:-70px;top:900px;width:620px;filter:drop-shadow(0 40px 60px rgba(0,0,0,.6))')}
        ${K.note('left:72px;top:930px;width:700px', 'Mehr steckt nicht drin. Wer hier aufhört, bekommt <b>Nicken und keine Bewegung.</b>')}
        ${K.grain}`,
      // 3 · Die sechs Schritte
      () => `
        ${K.amb('amb-cool', 'tr')}
        ${K.dim(0.12, 0.45)}${K.vig}
        ${K.chrome('WLAD AI <b>·</b> Argument')}
        ${HEAD(160, 'Die sechs<br><span class="m">Schritte.</span>', 100)}
        <div style="left:72px;top:440px;width:936px;display:flex;flex-direction:column;gap:14px">
          ${[['S', 'Statement', 'Die These, ein Satz.'], ['E', 'Explanation', 'Warum das so ist.'], ['X', 'eXample', 'Ein Fall, den alle kennen.'],
             ['I', 'Impact', 'Was passiert, wenn wir es tun oder lassen.'], ['E', 'Explanation of Impact', 'Warum diese Folge für genau diese Zuhörer zählt.'], ['R', 'Rebuttal', 'Der stärkste Einwand, selbst vorweggenommen.']]
            .map(([l, t, d]) => `<div class="g d rowc"><div class="badge">${l}</div><div><b>${t}</b><span class="s">${d}</span></div></div>`).join('')}
        </div>
        <div class="tag" style="left:72px;top:1296px">SEXIER <b>·</b> aus „Weiße Rhetorik“</div>
        ${K.grain}`,
      // 4 · Dasselbe Argument, neu gebaut
      () => `
        ${K.amb('amb-warm', 'br')}
        ${K.dim(0.12, 0.45)}${K.vig}
        ${K.chrome('WLAD AI <b>·</b> Argument')}
        ${HEAD(160, '<span class="m">Dasselbe Argument,</span><br>neu gebaut.', 92)}
        <div class="g doc" style="left:72px;top:400px;width:936px">
          ${[['S', 'Wir sollten das Projekt stoppen.'], ['E', 'Es bindet drei Leute und erreicht keine Kunden.'], ['X', 'Wie die Plattform vom letzten Jahr.'],
             ['I', 'Wir gewinnen ein Quartal.'], ['E', 'Das brauchen wir für den Launch.'], ['R', 'Ja, bisherige Arbeit geht verloren. Aber sie läuft ohnehin ins Leere.']]
            .map(([l, t]) => `<div class="r"><div class="badge">${l}</div><span>${t}</span></div>`).join('')}
        </div>
        <div class="tag" style="left:72px;top:1262px">Beispiel <b>·</b> sechs Schritte, zwei Minuten</div>
        ${K.grain}`,
      (c, o) => cta({ bubbleText: 'Gib mir <b>dein</b> Argument.' }, c, o),
    ] },
  // ───────── W03 · Rollenspiel: „Kein Budget“ ─────────
  { id: 'W03', slug: 'rollenspiel-budget', title: 'Dein Chef sagt: „Dafür ist kein Budget da.“', qr: '../social-kit/build/qr-w03.svg', tag: 'WLAD AI <b>·</b> Rollenspiel',
    slides: [
      // 1 · Der Chef-Satz
      () => `
        ${K.amb('amb-warm', 'bl')}
        ${K.dim(0.12, 0.45)}
        <div class="sk" style="left:380px;top:760px;width:820px;height:560px;background:radial-gradient(closest-side,rgba(191,255,0,.3),rgba(191,255,0,0))"></div>
        ${K.vig}
        ${K.chrome('WLAD AI <b>·</b> Rollenspiel')}
        ${HEAD(170, '<span class="m" style="font-size:62px;letter-spacing:-.03em">Dein Chef sagt:</span><br>„Dafür ist kein<br>Budget da.“<br><span class="lm">Was sagst du?</span>', 100)}
        ${K.mascot('right:-210px;top:560px;width:980px;filter:drop-shadow(0 44px 70px rgba(0,0,0,.65))')}
        ${K.note('left:72px;top:900px;width:520px', 'Ich spiele <b>deinen Chef.</b> Du hast einen Satz.')}
        ${K.rb(72, 1112, '')}
        ${K.grain}`,
      // 2 · Optionen
      () => `
        ${K.amb('amb-cool', 'br')}
        ${K.dim(0.12, 0.45)}${K.vig}
        ${K.chrome('WLAD AI <b>·</b> Rollenspiel')}
        ${HEAD(160, 'Wähle,<br><span class="m">bevor du weiterwischst.</span>', 92)}
        ${K.mascot('right:-110px;top:820px;width:640px;filter:drop-shadow(0 40px 60px rgba(0,0,0,.6))')}
        <div style="left:72px;top:420px;width:936px;display:flex;flex-direction:column;gap:26px">
          ${[['A', 'Okay, verstehe.'], ['B', 'Was müsste passieren, damit es im nächsten Quartal geht?'], ['C', 'Das ist unfair. Andere kriegen es auch.']]
            .map(([l, t]) => `<div class="g opt"><span class="l">${l}</span><span class="t"><span>${t}</span></span></div>`).join('')}
        </div>
        ${K.grain}`,
      // 3 · Wertung
      () => `
        ${K.amb('amb-warm', 'tr')}
        ${K.dim(0.12, 0.45)}${K.vig}
        ${K.chrome('WLAD AI <b>·</b> Rollenspiel')}
        ${HEAD(160, '<span class="m">WLAD AI</span><br>wertet.', 100)}
        <div style="left:72px;top:440px;width:936px;display:flex;flex-direction:column;gap:24px">
          ${[['A', 'Okay, verstehe.', 'no', '<span class="verd">Schwach</span>Du gibst auf, bevor das Gespräch beginnt.'],
             ['B', 'Was müsste passieren, damit es im nächsten Quartal geht?', 'yes', '<span class="verd">Stark</span>Rückfrage-Technik: Aus dem Nein wird ein Weg.'],
             ['C', 'Das ist unfair. Andere kriegen es auch.', 'no', '<span class="verd">Schwach</span>Du greifst die Person an, nicht das Problem.']]
            .map(([l, t, v, cm]) => `<div class="g ${v === 'yes' ? '' : 'd '}opt ${v}"><span class="l">${l}</span><span class="t"><span>${t}</span><small>${cm}</small></span></div>`).join('')}
        </div>
        ${K.grain}`,
      // 4 · Prinzip, Gesicht im Foto
      () => `
        ${K.amb('amb-cool', 'bl')}
        ${K.dim(0.12, 0.45)}${K.vig}
        ${K.chrome('WLAD AI <b>·</b> Rollenspiel')}
        ${HEAD(170, '<span class="m">Hart in der Sache.</span><br>Weich zur Person.', 100)}
        ${ph(570, 40, 420, 430, 500, 578, 780)}
        ${K.note('left:72px;top:1030px;width:600px', 'Und setz direkt den Termin: <b>„Wann schauen wir uns das gemeinsam an?“</b>')}
        ${K.grain}`,
      (c, o) => cta({ bubbleText: 'Wie klingt <b>dein</b> Chef?' }, c, o),
    ] },
];
window.CAROUSELS = CAROUSELS.map((c) => ({ id: c.id, slug: c.slug, title: c.title, n: c.slides.length }));

function render(ci, si, o) {
  const c = CAROUSELS[ci];
  document.getElementById('sheet').innerHTML = c.slides[si](c, o);
}

const q = new URLSearchParams(location.search);
// ?seats=0 rendert die Folie 5 ohne Begrenzung (Ersatz, solange die Aufnahme nicht technisch bei SEATS stoppt)
// ?ig=1 rendert die Folie 5 für Instagram: "Link in Bio" statt QR-Code
render(Number(q.get('c') || 0), Number(q.get('s') || 0), { seats: q.has('seats') ? Number(q.get('seats')) : SEATS, ig: q.get('ig') === '1' });
</script>
</body>
</html>
