<script>
const TRIAL='14 Tage kostenlos', WEB='Kostenloser Platz · 29.10.';
const L='<span class=lime>.</span>';
const C=[
{id:'P01',name:'Führung wird trainiert',slides:[
 {t:'cover',k:'Post 01 · Der neue Weg',h:'Führung wird nicht gelernt.<br>Sie wird trainiert'+L,s:'Warum die alte Art zu lernen bei Führungskräften nicht hält, und was stattdessen funktioniert. Wischen →',v:'lime',av:'big',size:'xs'},
 {t:'text',k:'01 · Das Problem',h:'Du weißt, was du tun solltest'+L,s:'Du hast die Bücher. Du warst im Seminar. Du kennst die Formel. Dein Team merkt trotzdem nichts. Das Problem war nie Wissen.',ph:'solitude',size:'s'},
 {t:'cap',k:'02 · Die Kurve',h:'Die Kurve, die jedes Seminar schlägt'+L,size:'xxs',cap:[['E·01','Nach 20 Minuten','Rund 40 Prozent des Gelernten sind weg.'],['E·02','Nach einem Tag','Etwa 65 Prozent.'],['E·03','Nach einem Monat','Bis zu 80 Prozent. Ebbinghaus, seit über 130 Jahren belegt. Unabhängig davon, wie gut der Trainer war.']],ph:'time'},
 {t:'vs',k:'03 · Der Unterschied',h:'Lernen vs. Trainieren'+L,vs:[['Lernen','Wissen sammeln','Zwei Tage im Jahr. Folien, Fallstudien, ein Ordner im Regal. Dein Team merkt nichts.'],['Trainieren','Verhalten bauen','15 Minuten am Tag. Dein echter Fall. Ein Gegenüber, das zurückredet. Dein Team merkt es in der ersten Woche.']],ph:'boardroom'},
 {t:'three',k:'04 · Der neue Weg',h:'Drei Schritte. Jeden Tag'+L,three:['Lektion: ein Framework, kurz. Das, das du heute brauchst.','Drill: dasselbe Framework an deinem echten Fall, nicht an einer Fallstudie.','Auswertung: was saß, was fehlte. Morgen der nächste Drill.'],ph:'sprint',size:'s'},
 {t:'text',k:'05 · Werden',h:'Werden statt wissen'+L,s:'Niemand wird Führungskraft, weil er mehr gelesen hat. Man wird es, weil man geübt hat, als es nicht zählte, damit es sitzt, wenn es zählt.',v:'photo',size:'s'},
 {t:'text',k:'06 · Das Prinzip',h:'15 Minuten.<br>Jeden Tag.<br><span class=lime>An deinem Fall.</span>',s:'Das ist die ganze Methode. Der Rest ist Disziplin, und die nimmt dir das System ab.',v:'lime',size:'xs',av:''},
 {t:'cta',k:'07 · Start',h:'Fang heute an'+L,s:'LeaderOS: Wlads Methodik als tägliches Training. Sechs Kurse, elf Drills, ein KI-Coach. 14 Tage kostenlos, ohne Karte. Link in Bio.',cta:TRIAL,av:'big',ph:'solitude'},
]},
{id:'P02',name:'Feedbackformel B·W·W',slides:[
 {t:'cover',k:'Post 02 · Feedback',h:'Feedback in drei Sätzen. Ohne dass es nach Vorwurf klingt'+L,s:'Die Feedbackformel B·W·W aus Wlads Trainings, Satz für Satz. Wischen →',ph:'feedback',size:'xs'},
 {t:'text',k:'01 · Warum es nicht ankommt',h:'„Du bist unzuverlässig.“',s:'Ein Urteil über die Person. Das Gegenüber verteidigt sich, statt zuzuhören. Ab diesem Satz ist es kein Feedback mehr, sondern ein Streit.',ph:'conflict',size:'xs'},
 {t:'three',k:'02 · Die Formel',h:'B · W · W'+L,three:['Beobachtung: „Ich habe beobachtet, dass …“ Nur, was man filmen könnte.','Wirkung: „Dadurch …“ Was es bei dir oder im Team auslöst.','Wunsch: „Ich wünsche mir …“ Konkret, in der Zukunft.'],v:'lime',av:'small'},
 {t:'chat',k:'03 · So klingt es',h:'Ein Satz. Drei Teile'+L,size:'xs',chat:[['Du','Ich habe beobachtet, dass der Bericht dreimal erst Freitagabend kam. Dadurch habe ich am Wochenende nachgearbeitet. Ich wünsche mir, dass er donnerstags um 12 bei mir liegt.'],['WladBot','Sauber. Kein „du bist“, kein „immer“. Jetzt die Pause: zehn Sekunden schweigen, bevor du weiterredest.']],note:'Beispiel · WladBot im LeaderOS',av:'small',ph:'writing'},
 {t:'cap',k:'04 · Die drei Fehler',h:'Woran es scheitert'+L,size:'xs',cap:[['F·01','Das Urteil','„Du bist …“ statt „Ich habe beobachtet …“. Urteile erzeugen Verteidigung.'],['F·02','Das Immer','„Immer“, „nie“, „ständig“. Ein Wort, und die Beobachtung ist angreifbar.'],['F·03','Der Rückzieher','„… aber sonst ist alles super.“ Der Nachsatz löscht den Wunsch.']],ph:'boardroom-b'},
 {t:'text',k:'05 · Die Regel',h:'Nie „du bist“.<br><span class=lime>Immer „ich habe beobachtet“.</span>',s:'Hart in der Sache, weich zur Person. Das ist der ganze Trick.',v:'lime',size:'xs',av:''},
 {t:'text',k:'06 · Üben',h:'Üb den ersten Satz, bevor du ihn brauchst'+L,s:'Das Gespräch dauert 90 Sekunden. Es scheitert nie am Gespräch. Es scheitert am ersten Satz, den du nie laut gesagt hast.',ph:'solitude',size:'s'},
 {t:'cta',k:'07 · Drill',h:'Dein Feedback für morgen'+L,size:'xs',s:'Schreib deinen B·W·W-Satz in die Kommentare oder üb ihn mit WladBot, der zurückredet. 14 Tage kostenlos. Link in Bio.',cta:TRIAL,av:'big',ph:'feedback'},
]},
{id:'P03',name:'Schwierige Gespräche',slides:[
 {t:'cover',k:'Post 03 · Schwierige Gespräche',h:'Das Gespräch, das du seit drei Wochen aufschiebst'+L,s:'Wlads Sekunden-Diagnose vor jedem schwierigen Gespräch, plus das Skript. Wischen →',ph:'conflict-b',size:'xs'},
 {t:'text',k:'01 · Vor der Tür',h:'Die meisten Gespräche scheitern vor der Tür'+L,s:'Nicht an der Rhetorik. An der falschen Einschätzung, welcher Gesprächstyp das hier überhaupt ist.',ph:'boardroom',size:'s'},
 {t:'cap',k:'02 · Vier Typen',h:'Vier Gesprächstypen'+L,size:'xxs',cap:[['T·01','Informieren','Fakten, keine Entscheidung offen. Klar, kurz, ohne Rechtfertigung.'],['T·02','Überzeugen','Eine Position, ein Ziel: Zustimmung. Kein Kompromiss.'],['T·03','Verhandeln','Beide Seiten haben Interessen. Der Kompromiss ist das Ziel.'],['T·04','Konfrontieren','Eine Grenze wird benannt. Nicht verhandelbar.']],ph:'time'},
 {t:'text',k:'03 · Der Fehler',h:'Verhandeln, wo konfrontiert werden müsste'+L,s:'Du gehst mit Kompromissbereitschaft in ein Grenzgespräch und kommst ohne Grenze wieder raus. Dein Team hat es gesehen.',ph:'conflict',size:'s'},
 {t:'three',k:'04 · Das Skript',h:'Konfrontieren in drei Zügen'+L,size:'xs',three:['Eröffne mit der Spannung, nicht mit dem Vorwurf: „Ich möchte über die Spannung zwischen uns reden.“','Drei vorbereitete B·W·W-Sätze. Nach jedem: zehn Sekunden schweigen.','Drei Optionen anbieten statt eine Lösung diktieren. Dann ein Datum.'],v:'lime',av:'small'},
 {t:'cap',k:'05 · Anti-Patterns',h:'Drei Sätze, die alles kippen'+L,size:'xs',cap:[['A·01','„Wir müssen mal reden.“','Der Vorlauf, der das Gegenüber 24 Stunden anspannt.'],['A·02','„Ich finde, du …“','Das Ich am Anfang. Es wird ein Vorwurf.'],['A·03','„Wir kriegen das schon hin.“','Das Ende ohne Datum. Eine Geste, kein Ergebnis.']],ph:'listening'},
 {t:'text',k:'06 · Das Prinzip',h:'Hart in der Sache.<br><span class=lime>Weich zur Person.</span>',s:'Die Grenze bleibt. Der Respekt auch.',v:'lime',size:'xs',av:''},
 {t:'cta',k:'07 · Simulation',h:'Üb es, bevor es zählt'+L,s:'In LeaderOS führst du das Gespräch in der Simulation mit einem Gegenüber, das zurückredet. Mit Auswertung danach. 14 Tage kostenlos. Link in Bio.',cta:TRIAL,av:'big',ph:'conflict-b',size:'xs'},
]},
{id:'P04',name:'Die 5 Rollen',slides:[
 {t:'cover',k:'Post 04 · Die 5 Rollen',h:'Du hast nicht eine Rolle.<br>Du hast fünf'+L,s:'Wlads Kern-Framework aus „Die 5 Rollen einer Führungskraft“. Wischen →',ph:'presence',av:'small',size:'xs'},
 {t:'text',k:'01 · Der Denkfehler',h:'„Ich bin Führungskraft.“',s:'Das ist keine Rolle, das ist ein Titel. Welche Rolle gerade dran ist, entscheidet die Situation, nicht die Stellenbeschreibung.',ph:'boardroom-b',size:'xs'},
 {t:'cap',k:'02 · Rollen 1 bis 3',h:'Sichtbar'+L,size:'s',cap:[['R·01','Kommunikator','Charismatisch auftreten, souverän argumentieren. Präsenz, bevor der erste Satz fällt. Für viele der Default-Modus.'],['R·02','Manager','Entscheiden. Aus einer Diskussion einen Beschluss machen. Wer hier schwächelt, lässt Teams tagelang in der Schwebe.'],['R·03','Team-Leader','Die richtigen Leute finden, delegieren, motivieren. Wer nicht delegiert, wird zum Flaschenhals.']],ph:'stage'},
 {t:'cap',k:'03 · Rollen 4 und 5',h:'Unbequem'+L,size:'s',cap:[['R·04','Psychologe','Empathisch begegnen, Konflikte früh erkennen. Unsichtbar, wenn gut gespielt: die Krise, die gerade nicht passiert.'],['R·05','Problemlöser','Verhandeln, Kritikgespräche führen, Change tragen. Die Rolle, die am meisten vermieden wird, und die am meisten über Vertrauen entscheidet.']],ph:'conflict'},
 {t:'three',k:'04 · Selbst-Diagnose',h:'Drei Fragen'+L,three:['Welche Rolle hast du in den letzten drei Wochen am meisten gespielt? Vermutlich Kommunikator oder Manager.','Welche am wenigsten? Vermutlich Psychologe oder Problemlöser.','Welcher bist du gerade ausgewichen, weil sie unbequem ist?'],v:'lime',av:'small'},
 {t:'text',k:'05 · Der Hebel',h:'Die Rolle, die du unterspielst, ist dein größter Hebel'+L,s:'Das Framework heißt nicht „spiele alle fünf täglich“. Es heißt: erkenne, welche fehlt, und kompensiere bewusst.',ph:'solitude',size:'xxs'},
 {t:'text',k:'06 · Das Prinzip',h:'Fünf Rollen.<br><span class=lime>Eine Person.</span>',s:'Kommunikator · Manager · Team-Leader · Psychologe · Problemlöser.',v:'lime',size:'xs',av:''},
 {t:'cta',k:'07 · Diagnose',h:'Welche fehlt bei dir'+L,size:'xs',s:'In LeaderOS diagnostiziert WladBot deine Rollen-Verteilung an deinen echten Wochen und baut den Drill dazu. 14 Tage kostenlos. Link in Bio.',cta:TRIAL,av:'big',ph:'presence'},
]},
{id:'P05',name:'Delegieren · 5 Stufen',slides:[
 {t:'cover',k:'Post 05 · Delegieren',h:'Delegieren ist kein Ja oder Nein.<br>Es sind fünf Stufen'+L,s:'Warum Aufgaben zurückkommen, und wie du den Spielraum laut aussprichst. Wischen →',v:'lime',av:'big',size:'xxs'},
 {t:'text',k:'01 · Rückdelegation',h:'Warum es wieder auf deinem Tisch landet'+L,s:'Du hast delegiert, aber nicht gesagt, wie viel Spielraum. Unklare Delegation kommt zurück. Immer. Meist freitags.',ph:'time',size:'s'},
 {t:'cap',k:'02 · Stufe 1 und 2',h:'Eng geführt'+L,size:'s',cap:[['S·01','Mach genau das','So, wie gezeigt. Für die erste Quartalsauswertung einer neuen Kollegin.'],['S·02','Sammle Optionen','Du schlägst vor, ich entscheide. Für Aufgaben, bei denen der Schaden schwer zu korrigieren ist.']],ph:'writing'},
 {t:'cap',k:'03 · Stufe 3 bis 5',h:'Frei geführt'+L,size:'s',cap:[['S·03','Entscheide selbst','Hol dir vor der Umsetzung mein Okay.'],['S·04','Entscheide und setz um','Informiere mich danach.'],['S·05','Der Bereich gehört dir','Du informierst mich im festen Rhythmus, zum Beispiel im Wochenupdate.']],ph:'team'},
 {t:'three',k:'04 · Die Wahl',h:'Drei Fragen vor der Stufe'+L,three:['Wie gut kennt die Person die Aufgabe?','Wie groß ist der Schaden, wenn es schiefgeht, und wie leicht ist er zu korrigieren?','Wie viel Zeit ist zum Lernen da?'],v:'lime',av:'small'},
 {t:'chat',k:'05 · Laut aussprechen',h:'Laut aussprechen'+L,chat:[['Du','Quartalsauswertung für die Geschäftsleitung, dein erstes Mal. Stufe 2: Du sammelst Optionen, ich entscheide. Mittwoch schauen wir gemeinsam drauf.'],['Gegenüber (Simulation)','Passt. Bis Mittwoch zwei Varianten mit Vor- und Nachteilen.']],note:'Beispiel · Simulation im LeaderOS',av:'small',ph:'boardroom'},
 {t:'text',k:'06 · Das Prinzip',h:'Sprich die Stufe aus.<br><span class=lime>Und den Termin.</span>',s:'Wer Stufe und Kontrollpunkt nicht benennt, delegiert unklar. Und unklare Delegation ist keine.',v:'lime',size:'xs',av:''},
 {t:'cta',k:'07 · Drill',h:'Deine nächste Übergabe'+L,size:'xs',s:'Nimm eine Aufgabe von dieser Woche, wähl die Stufe, sprich sie aus. Oder üb die Übergabe mit WladBot. 14 Tage kostenlos. Link in Bio.',cta:TRIAL,av:'big',ph:'team'},
]},
{id:'P06',name:'10 Stufen des Zuhörens',slides:[
 {t:'cover',k:'Post 06 · Zuhören',h:'80 Prozent aller Führungskräfte hören auf Stufe 2 zu'+L,s:'Wlads Modell der zehn Stufen des Zuhörens, von abwesend bis Stille. Wischen →',ph:'listening-b',size:'xxs'},
 {t:'cap',k:'01 · Stufe 1 bis 3',h:'Zuhören, das keins ist'+L,size:'xs',cap:[['Z·01','Nicht zuhören','Körperlich da, gedanklich im nächsten Meeting.'],['Z·02','Auf Antwort warten','Du hörst nur, um die Pause zu erwischen. Hier bleiben rund 80 Prozent hängen, ohne es zu merken.'],['Z·03','Selektiv zuhören','Du filterst nach dem, was deine Meinung bestätigt.']],ph:'boardroom-b'},
 {t:'text',k:'02 · Der Test',h:'Kannst du in einem Satz sagen, was dein Gegenüber wollte'+L,s:'Nicht, was du geantwortet hast. Wenn nein, warst du auf Stufe 1 bis 3.',ph:'solitude',size:'xxs'},
 {t:'cap',k:'03 · Stufe 4 bis 6',h:'Verstehen statt reagieren'+L,size:'xs',cap:[['Z·04','Empathisch','Du hörst die Emotion hinter den Worten. „Läuft schon“ klingt müde anders als zuversichtlich.'],['Z·05','Aktiv','Nachfragen, paraphrasieren, spiegeln: „Wenn ich dich richtig verstehe …“'],['Z·06','Strukturell','Du hörst, was nicht gesagt wird. Die ausgelassene Zahl, das übersprungene Thema.']],ph:'listening'},
 {t:'cap',k:'04 · Stufe 7 bis 10',h:'Das tiefe Zuhören'+L,size:'xs',cap:[['Z·07','Systemisch','Nicht nur die Person, das System um sie herum: Team-Dynamik, Prozess, Anreize.'],['Z·08','Diagnostisch','Das wiederkehrende Muster über mehrere Gespräche, nicht das einzelne Symptom.'],['Z·09','Generativ','Du hilfst dem Gegenüber, klarer zu denken, ohne die Antwort vorzugeben.'],['Z·10','Stille','Du sagst nichts und hältst Raum. Manche Probleme lösen sich nur im Schweigen.']],ph:'time'},
 {t:'text',k:'05 · Die Schwelle',h:'Ab Stufe 4 beginnt Führung'+L,s:'Davor reagierst du. Danach verstehst du. Dazwischen liegt die Schwelle, an der aus Reflex Führungsarbeit wird.',ph:'presence',size:'s'},
 {t:'text',k:'06 · Das Prinzip',h:'Zuhören ist keine Fähigkeit.<br><span class=lime>Es sind zehn.</span>',s:'Und jede lässt sich trainieren, eine Stufe pro Woche.',v:'lime',size:'xs',av:''},
 {t:'cta',k:'07 · Drill',h:'Dein nächstes 1:1'+L,size:'xs',s:'Nach dem Gespräch: fass in einem Satz zusammen, was dein Gegenüber wollte. Dann bewerte deine Stufe. Oder lass WladBot mithören. Link in Bio.',cta:TRIAL,av:'big',ph:'listening-b'},
]},
{id:'P07',name:'SEXIER · Argumentieren',slides:[
 {t:'cover',k:'Post 07 · Rhetorik',h:'Warum dein Vorstand nicht überzeugt ist'+L,s:'Das SEXIER-Modell aus „Weiße Rhetorik“: sechs Schritte für ein Argument, das hält. Wischen →',ph:'stage',size:'xs'},
 {t:'text',k:'01 · Der Fehler',h:'Du argumentierst immer gleich'+L,s:'Für den Kaffeeautomaten wie für die Millionen-Investition. Je strittiger die These, desto höher das Level, das du brauchst. Das falsche Level ist der häufigste Fehler, in beide Richtungen.',ph:'boardroom',size:'s'},
 {t:'cap',k:'02 · S · E · X',h:'Die erste Hälfte'+L,size:'xs',cap:[['S','Statement','Die Behauptung. Ein Satz, klar und angreifbar.'],['E','Explanation','Die Begründung. Warum stimmt das?'],['X','eXample','Das Beispiel. Konkret, nachprüfbar, aus der Welt deines Gegenübers.']],ph:'writing'},
 {t:'cap',k:'03 · I · E · R',h:'Die zweite Hälfte'+L,size:'xs',cap:[['I','Impact','Die Auswirkung. Was folgt daraus, für genau diese Zuhörer?'],['E','Explanation of Impact','Warum diese Auswirkung zählt.'],['R','Rebuttal','Der Einwand, den du selbst vorwegnimmst, bevor ihn jemand anderes bringt.']],ph:'presence'},
 {t:'three',k:'04 · Die Level-Regel',h:'Welches Level wann'+L,three:['Konsens-Thema: Behauptung plus ein „weil“. Mehr wirkt belehrend.','Leichter Widerstand: Behauptung, Begründung, Beispiel.','Strittige Entscheidung: SEXIER. Alle sechs Schritte, jeder Pflicht.'],v:'lime',av:'small'},
 {t:'text',k:'05 · Der Rebuttal',h:'Der Schritt, den alle auslassen'+L,s:'Der Einwand kommt sowieso. Wer ihn selbst nennt und entkräftet, wirkt souverän. Wer ihn abwartet, wirkt getroffen.',ph:'conflict-b',size:'s'},
 {t:'text',k:'06 · Das Prinzip',h:'Nicht das perfekte Argument.<br><span class=lime>Das richtige Level.</span>',s:'Zur richtigen Zeit, vor den richtigen Leuten.',v:'lime',size:'xs',av:''},
 {t:'cta',k:'07 · Drill',h:'Dein nächster Pitch in SEXIER'+L,s:'Nimm die These von nächster Woche und bau sie in sechs Schritten. WladBot prüft, ob der Rebuttal fehlt. 14 Tage kostenlos. Link in Bio.',cta:TRIAL,av:'big',ph:'stage',size:'xs'},
]},
{id:'P08',name:'Motivation 4.0',slides:[
 {t:'cover',k:'Post 08 · Motivation',h:'Niemand hat je für einen Obstkorb eine Extrameile gemacht'+L,s:'Die drei Hebel, die tatsächlich tragen, und das 15-Minuten-Ritual dazu. Wischen →',ph:'team',size:'xxs'},
 {t:'text',k:'01 · Der Denkfehler',h:'Motivation ist keine Zahlung'+L,s:'Bonus, Kicker, Benefits: Milliarden jedes Jahr, und die Energie sinkt trotzdem. Motivation ist ein Zustand aus drei Erlebnissen, die kein Budget ersetzt.',ph:'remote',size:'s'},
 {t:'cap',k:'02 · Die drei Hebel',h:'Was wirklich zieht'+L,size:'xs',cap:[['M·01','Autonomie','Das Wie gehört dem Team, das Wohin der Führung.'],['M·02','Fortschritt','Nichts motiviert stärker als sichtbare eigene Bewegung. Jede Woche ein Moment, der sie zeigt.'],['M·03','Zugehörigkeit','„Wir hier“ muss wahr sein. Entsteht in kleinen Momenten von Rückendeckung, nicht auf Team-Events.']],ph:'team-b'},
 {t:'cap',k:'03 · Woran du es erkennst',h:'Welcher Hebel fehlt'+L,size:'xs',cap:[['Fehlt Autonomie','Das Team fragt bei Kleinigkeiten nach Freigabe. Nicht aus Unsicherheit. Aus Selbstschutz.'],['Fehlt Fortschritt','Die Energie sinkt mitten im Projekt, obwohl objektiv alles läuft. Niemand sieht die Bewegung.'],['Fehlt Zugehörigkeit','Im Meeting vorsichtig, im Flur ehrlich. Das Team schützt sich vor dem Raum.']],ph:'boardroom-b'},
 {t:'three',k:'04 · Das Wochen-Ritual',h:'15 Minuten pro Woche'+L,size:'xs',three:['Montag: eine Entscheidung explizit ans Team geben. Mit Rahmen, ohne Rückversicherung.','Mittwoch: fünf Minuten „Was ist seit letzter Woche konkret besser?“ Sammeln, nicht kommentieren.','Freitag: eine Person, die Rückendeckung gebraucht hätte, bekommt sie. Öffentlich, ohne Aber.'],v:'lime'},
 {t:'text',k:'05 · Nach vier Wochen',h:'Nach vier Wochen merkst du es'+L,s:'Daran, was dein Team sagt, wenn du nicht im Raum bist. Kein Kickoff, kein Poster. Drei kleine Rituale, sichtbar für alle.',ph:'solitude',size:'xs'},
 {t:'text',k:'06 · Das Prinzip',h:'Für Vertrauen schon.<br><span class=lime>Für einen Obstkorb nie.</span>',s:'Autonomie · Fortschritt · Zugehörigkeit.',v:'lime',size:'xs',av:''},
 {t:'cta',k:'07 · Drill',h:'Lass dein letztes Protokoll gegenlesen'+L,size:'xxs',s:'WladBot liest dein Team-Meeting gegen die drei Hebel: „Wo habe ich diese Woche Autonomie genommen statt gegeben?“ 14 Tage kostenlos. Link in Bio.',cta:TRIAL,av:'big',ph:'team',size:'xs'},
]},
{id:'P09',name:'KI für Führungskräfte',slides:[
 {t:'cover',k:'Post 09 · KI-Führung',h:'KI ohne Methodik ist Slop'+L,s:'Drei Use-Cases, die heute funktionieren, und die eine Regel, die den Unterschied macht. Wischen →',v:'lime',av:'big',size:'s'},
 {t:'text',k:'01 · Zwei falsche Antworten',h:'„Alles“ oder „noch zu früh“'+L,s:'Beides falsch. KI ist ein Werkzeug, kein Strategiewechsel. Sie ersetzt nicht deine Methodik. Sie nimmt dir Zeit weg von den Aufgaben, die am meisten Zeit fressen.',ph:'ai',size:'xs'},
