<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="premium.css">
<script src="data-ig.js"></script><script src="data-a.js"></script><script src="data-b.js"></script>
</head><body>
<script>
const q=new URLSearchParams(location.search); const SET=q.get('set')||'ig';
const HANDLE='@wlad.jachtchenko';
const esc=(s)=>s||'';
function photo(x){
  if(x.v==='photo') return `<div class="ph warm" style="background-image:url('wlad-portrait.jpg');background-position:42% 25%"></div>`;
  let ph=x.ph; if(!ph&&x.hf) ph=(window.FALLBACK||{})[x.hf];
  if(ph) return `<div class="ph ${x.av!==undefined?'av':''}" style="background-image:url('ph/${ph}.webp')"></div>`;
  return `<div class="studio"></div>`;
}
function body(x){
  if(x.t==='chat') return `<div class=chat>${x.chat.map(([w,m])=>`<div class="card ${w==='Du'?'user':(w==='WladBot'||w==='Verteidigung')?'ai':''}"><span class=who>${w}</span><p>${m}</p></div>`).join('')}</div>${x.note?`<p class=note>${x.note}</p>`:''}`;
  if(x.t==='cap') return `<div class=cap>${x.cap.map(([c,t,d])=>d===undefined?`<div class=card><b>${c}</b><span>${t}</span></div>`:`<div class=card><b><small>${c}</small>${t}</b><span>${d}</span></div>`).join('')}</div>`;
  if(x.t==='three') return `<div class=three>${x.three.map((t,j)=>`<div class=card><b>${j+1}</b><p>${t}</p></div>`).join('')}</div>`;
  if(x.t==='vs') return `<div class=vs>${x.vs.map(([tag,t,d],j)=>`<div class="card ${j?'new':'old'}"><span class=tag2>${tag}</span><h3>${t}</h3><p>${d}</p></div>`).join('')}</div>`;
  if(x.list) return `${x.s?`<p class=sub>${x.s}</p>`:''}<div class=list>${x.list.map((t,j)=>`<div><b>${j+1}</b><span>${t}</span></div>`).join('')}</div>`;
  return x.s?`<p class=sub>${x.s}</p>`:'';
}
function slide(x,opts){
  const {cid,i,n,kind,tags,story}=opts; if(opts.paper){x={...x,ph:undefined,hf:undefined};}
  const isCta=x.t==='cta'||(!x.t&&x.cta&&kind==='single');
  const hasAv=x.av!==undefined; const paper=!!opts.paper;
  const SHRINK={'P03-5':'xxs','P05-6':'xxs','P08-8':'xxs'}; const size=SHRINK[`${cid}-${i}`]||x.size||(x.t==='vs'||x.t==='cap'?'s':'')
  const pager=n>1?`${String(i).padStart(2,'0')}/${String(n).padStart(2,'0')}`:'';
  const right= isCta?`<span class=ctl>${x.cta==='Kostenloser Platz · 29.10.'||x.cta==='Kostenloser Platz · 29.10.'?'Platz sichern · 29.10. ↗':x.cta==='Gespräch ab 2.11. buchen'?'Gespräch buchen ↗':'Kostenlos starten ↗'}</span>`:(n>1?`<span class=swipe>${i<n?'Wischen →':'Link in Bio'}</span>`:`<span class=swipe>Link in Bio</span>`);
  const frameLbl=kind==='single'?`${cid} · ${HANDLE}`:`${cid} · ${pager}`;
  return `<section class="slide ${story?'story':''} ${paper?'paper':''} ${hasAv?'has-avatar':''} ${x.num?'has-num':''}" data-c="${cid}" data-i="${i}">
  ${photo(x)}<div class=grade></div><div class=slats></div><div class=vign></div><div class=grain></div>
  ${x.num?`<div class=num>${x.num}</div>`:''}
  ${hasAv?`<img class="avatar ${x.av||''}" src="avatar.png" alt="">`:''}
  ${x.hf&&window.SCENE?'':''}
  <div class=frame><span class=lbl>${frameLbl}</span><i class="tick tl"></i><i class="tick br"></i></div>
  ${tags.map((t,j)=>`<span class="tag t${j+1}">${t}</span>`).join('')}
  <div class=top><span class=wm>LEADER<i>·</i>OS</span><span class=ser>Führung wird trainiert.</span><span>${HANDLE}</span></div>
  <div class=mid>${kind==='single'?`<p class=k>${x.k}</p>`:`<p class=k>${x.k}</p>`}<h1 class="h ${size}">${x.h}</h1>${body(x)}</div>
  <div class=bot><div class=who2><img src="wlad-portrait.jpg" alt=""><span><b>Wlad Jachtchenko</b><small>LeaderOS · leader-os.de</small></span></div>${right}</div>
</section>`;
}

const COVER=['paper','photo','hudl','av','card','photo','spec','av','paper','hud','spec','av'];
const PH12={0:'sprint',4:'team',8:'ai-b'};
const BIG={1:'Reps<i>.</i>',2:'B·W·W',3:'4',4:'5',5:'5',6:'80<i>%</i>',7:'SEXIER',8:'0 €',9:'Slop<i>.</i>',10:'5 Sek<i>.</i>',11:'363',12:'OS<i>.</i>'};
const BIGSZ={2:'xs',7:'xs',10:'s'};
const WINCAP={1:'Ebbinghaus · 1885',3:'Vier Gesprächstypen',5:'Fünf Stufen',9:'Drei Use-Cases'};
function cover(x,ci,n){
  const kind=COVER[ci]; const pid='P'+String(ci+1).padStart(2,'0'); const no=String(ci+1).padStart(2,'0');
  const chrome=`<div class=top><span class=wm>LEADER<i>·</i>OS</span><span class=ser>Führung wird trainiert.</span><span>${HANDLE}</span></div>`;
  const bot=`<div class=bot><div class=who2><img src="wlad-portrait.jpg" alt=""><span><b>Wlad Jachtchenko</b><small>LeaderOS · leader-os.de</small></span></div><span class=swipe>Wischen →</span></div>`;
  const kick=`<p class=k>Post ${no} · ${x.k.split('·').slice(1).join('·').trim()||x.k}</p>`;
  if(kind==='paper') return `<section class="slide paper cover-paper" data-c="${pid}" data-i="1"><div class=studio></div><div class=slats></div><div class=vign></div><div class=grain></div>
    <div class=no>${no}</div><span class=winlbl>${pid} · 01/${String(n).padStart(2,'0')}</span><div class=win><div class=ph style="background-image:url('ph/${x.ph||'boardroom'}.webp')"></div><span class=cap>${WINCAP[ci+1]||'Framework'}</span></div>
    <span class="tag t1" style="right:auto;left:76px;top:168px">Post ${no}</span>
    ${chrome}<div class=mid>${kick}<h1 class="h">${x.h}</h1><p class=sub>${x.s||''}</p></div>${bot}</section>`;
  if(kind==='spec') return `<section class="slide paper cover-spec" data-c="${pid}" data-i="1"><div class=studio></div><div class=slats></div><div class=vign></div><div class=grain></div>
    <span class="tag t1">Post ${no}</span>
    ${chrome}<div class=mid>${kick}<div class="bigword ${BIGSZ[ci+1]||''}">${BIG[ci+1]}</div><div class=spec-rule></div><h1 class="h">${x.h}</h1><p class=sub>${x.s||''}</p></div>${bot}</section>`;

  if(kind==='hudl') return `<section class="slide paper cover-hud" data-c="${pid}" data-i="1"><div class=studio></div><div class=slats></div><div class=vign></div><div class=grain></div>
    <div class=hud><div class=win><div class=ph style="background-image:url('ph/conflict-b.webp')"></div><div class=gridl></div><i class="br tl" style="left:14px;top:14px"></i><i class="br tr" style="right:14px;top:14px"></i><i class="br bl" style="left:14px;bottom:14px"></i><i class="br br2" style="right:14px;bottom:14px"></i><div class=face style="left:170px;top:120px;width:160px;height:190px"><i>GESPRÄCH_ID: AKTIV</i></div></div>
    <span class=ts style="right:76px;top:150px">2026-10-12 · 08:00</span>
    <div class=panel style="left:76px;top:560px"><b>Gesprächs-Diagnose</b>TYP: <em>UNKLAR</em><br>STATUS: <span>AUFGESCHOBEN</span><br>SEIT: <em>21 TAGE</em><br>VORBEREITUNG: <span>KEINE</span><br>RISIKO: <em>ESKALATION</em></div></div>
    <span class="tag t1" style="right:auto;left:76px;top:150px">Post ${no}</span>
    ${chrome}<div class=mid>${kick}<h1 class="h">${x.h}</h1><p class=sub>${x.s||''}</p></div>${bot}</section>`;
  if(kind==='hud') return `<section class="slide cover-hud" data-c="${pid}" data-i="1"><div class="ph" style="background-image:url('ph/${x.ph||'boardroom-b'}.webp');filter:grayscale(1) contrast(1.18) brightness(.78)"></div><div class=grade></div><div class=grain></div>
    <div class=hud><div class=gridl></div><i class="br tl" style="left:60px;top:140px"></i><i class="br tr" style="right:60px;top:140px"></i><i class="br bl" style="left:60px;bottom:120px"></i><i class="br br2" style="right:60px;bottom:120px"></i>
    <span class=ts style="left:76px;top:150px">2026-10-19 · 09:14:32</span><span class=rec>REC</span>
    <div class=face style="left:560px;top:300px;width:170px;height:210px"><i>FACIAL_ID: AKTIV</i></div>
    <div class=panel style="right:76px;top:560px"><b>Person of Interest</b>MUSTER: <em>SCHULDUMKEHR</em><br>ERKANNT: <span>NEIN</span><br>REAKTIONSZEIT: <em>5 SEK</em><br>BODEN: <span>VERLOREN</span><br>TRAINING: <em>0 REPS</em></div></div>
    <span class="tag t1" style="top:200px">Post ${no}</span>
    ${chrome}<div class=mid>${kick}<h1 class="h">${x.h}</h1><p class=sub>${x.s||''}</p></div>${bot}</section>`;
  if(kind==='card') return `<section class="slide paper cover-card" data-c="${pid}" data-i="1"><div class=studio></div><div class=slats></div><div class=vign></div><div class=grain></div>
    <span class=plab style="left:76px;top:168px">1. Framework</span><span class=plab style="right:76px;top:168px">F · Codes</span><span class=plab style="left:76px;top:700px">S · Stufe</span><span class=plab style="right:76px;top:700px">M · Kontrollpunkt</span>
    <div class=pline style="left:130px;top:200px;height:60px"></div><div class=pline style="right:140px;top:200px;height:60px"></div>
    <div class=pcard><span class=brand>LEADER·OS</span><div class=pw><div class=ph style="background-image:url('ph/team.webp')"></div><span class=lab>PORTRAIT</span><span class=lk>* STUFE 02 *</span></div>
      <div><h4>PASS CARD</h4><div class=rows><div><span>FRAMEWORK:</span><span>DELEGATION</span></div><div><span>STUFEN:</span><span>01 – 05</span></div><div><span>SPIELRAUM:</span><span>LAUT AUSSPRECHEN</span></div><div><span>KONTROLLPUNKT:</span><span>MITTWOCH 10:00</span></div><div><span>TYP:</span><span>DRILL · 15 MIN</span></div></div><div class=bar></div><span class=lg>W<i>·</i>OS</span></div></div>
    <span class="tag t1" style="right:auto;left:76px;top:150px;display:none">Post ${no}</span>
    ${chrome}<div class=mid>${kick}<h1 class="h">${x.h}</h1><p class=sub>${x.s||''}</p></div>${bot}</section>`;
  if(kind==='av') return `<section class="slide cover-av has-avatar" data-c="${pid}" data-i="1"><div class=studio></div><div class=slats></div><div class=vign></div><div class=grain></div>
    <img class="avatar" src="avatar.png" alt=""><span class="tag t1">Post ${no}</span>
    ${chrome}<div class=mid>${kick}<h1 class="h">${x.h}</h1><p class=sub>${x.s||''}</p></div>${bot}</section>`;
  // photo
  return `<section class="slide" data-c="${pid}" data-i="1"><div class="ph warm" style="background-image:url('ph/${x.ph||'boardroom'}.webp')"></div><div class=grade></div><div class=slats></div><div class=vign></div><div class=grain></div>
    <div class=frame><span class=lbl>${pid} · 01/${String(n).padStart(2,'0')}</span><i class="tick tl"></i><i class="tick br"></i></div><span class="tag t1">Post ${no}</span>
    ${chrome}<div class=mid>${kick}<h1 class="h">${x.h}</h1><p class=sub>${x.s||''}</p></div>${bot}</section>`;
}

let html='';
if(SET==='ig'){
  window.C.forEach((c,ci)=>{const n=c.slides.length;c.slides.forEach((x,i)=>{
    if(i===0){html+=cover({...x,ph:x.ph||PH12[ci]||'boardroom'},ci,n);return;}
    const tags=(x.v==='lime'&&x.t==='text'?['Prinzip']:(x.t==='cta'?['Start']:[]));
    html+=slide(x,{cid:c.id,i:i+1,n,kind:'carousel',tags,paper:x.v==='lime'&&x.t==='text'});
  });});
} else if(SET==='a'||SET==='b'){
  const S=SET==='a'?window.SA:window.SB;
  S.forEach((x,i)=>{const tags=[x.k.split('·')[0].trim().replace(/\s0\d$/,'')]; const paper=(i%2===1)&&x.av===undefined&&x.v!=='photo'; html+=slide(paper?{...x,ph:undefined,hf:undefined}:x,{cid:(SET==='a'?'A':'B')+String(i+1).padStart(2,'0'),i:i+1,n:1,kind:'single',tags,paper});});
} else if(SET==='story'){
  // principle slides (lime text slides) of the 12 carousels + 18 statements from set A as 9:16 stories
  window.C.forEach((c,ci)=>{const x=c.slides.find(s=>s.v==='lime'&&s.t==='text'); if(x) html+=slide({...x,k:`Post ${String(ci+1).padStart(2,'0')} · Prinzip`,ph:c.slides[0].ph||'solitude',v:undefined,av:undefined,size:'s'},{cid:'ST'+String(ci+1).padStart(2,'0'),i:1,n:1,kind:'single',tags:['Prinzip'],story:true});});
  window.SA.filter(x=>!x.list&&x.s).slice(0,18).forEach((x,i)=>{html+=slide({...x,v:undefined,av:undefined,size:'s',ph:x.ph||'boardroom'},{cid:'ST'+String(13+i).padStart(2,'0'),i:1,n:1,kind:'single',tags:[x.k.split('·')[0].trim().replace(/\s0\d$/,'')],story:true});});
}
document.body.innerHTML=html; window.__ALL={C:window.C,SA:window.SA,SB:window.SB,SCENE:window.SCENE};
</script></body></html>
