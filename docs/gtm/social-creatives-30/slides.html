<!doctype html><html lang="de"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>.slide[data-i="22"] .list div{padding:13px 0;font-size:30px}.slide[data-i="22"] .list div b{font-size:42px}.slide[data-i="22"] .h{font-size:84px}</style>
</head><body>
<script>
const CTA_WEB='Kostenloser Platz · 29.10.';
const CTA_TRIAL='14 Tage kostenlos';
// v: dark | lime | photo (Wlad) · ph: Hintergrundfoto (ph/*.webp) · av: Avatar-Figur
const S=[
{k:'Paradigmenwechsel 01',h:'Führung wird nicht gelernt.<br><span class=lime>Sie wird trainiert.</span>',s:'Niemand wird fit, weil er ein Buch über Fitness gelesen hat. Bei Führung tun wir genau das. Seit 20 Jahren.',cta:CTA_WEB,v:'photo'},
{k:'Paradigmenwechsel 02',h:'<span class=strike>Wissen</span><br>Reps<span class=lime>.</span>',s:'Jede Führungskraft weiß, dass man Feedback geben sollte. Fast keine tut es gut. Der Unterschied ist nicht Wissen. Es sind Wiederholungen.',cta:CTA_WEB,v:'dark',ph:'training-b'},
{k:'Paradigmenwechsel 03',h:'Ein Seminar im Jahr.<br>365 Gespräche<span class=lime>.</span>',s:'Das ist das Verhältnis, mit dem die meisten Führungskräfte arbeiten. Und dann wundern sie sich, dass nichts hängen bleibt.',cta:CTA_WEB,v:'lime',size:'s'},
{k:'Paradigmenwechsel 04',h:'Du brauchst keinen neuen Kurs.<br><span class=lime>Du brauchst ein Training.</span>',s:'Kurs: einmal durchschauen, abhaken, vergessen. Training: jeden Tag 15 Minuten, bis das Verhalten sitzt. LeaderOS ist das Zweite.',cta:CTA_TRIAL,v:'dark',size:'xs',ph:'sprint'},
{k:'Paradigmenwechsel 05',h:'Das alte Modell<span class=lime>.</span>',s:'',list:['Seminar buchen','Zwei Tage Notizen','Montag: alles wie vorher','In 12 Monaten wieder'],cta:CTA_WEB,v:'dark',size:'s',ph:'training'},
{k:'Paradigmenwechsel 06',h:'Das neue Modell<span class=lime>.</span>',s:'',list:['Jeden Tag ein Drill, 15 Minuten','Das echte Gespräch vorher üben','KI-Coach, der Wlads Methodik kennt','Nach 30 Tagen: neues Verhalten'],cta:CTA_TRIAL,v:'lime',size:'s',av:'small'},
{k:'Realität 01',h:'Welches Gespräch schiebst du gerade auf<span class=lime>?</span>',s:'Das Feedback. Die Gehaltsfrage. Der Konflikt, den alle sehen. Aufschieben kostet jede Woche mehr als das Gespräch selbst.',cta:CTA_WEB,v:'dark',size:'xs',ph:'conflict'},
{k:'Realität 02',h:'Dein letztes Führungs&shy;seminar<span class=lime>.</span><br>Was ist davon übrig?',s:'Ehrlich. Nicht die Erinnerung an den Kaffee. Welches Verhalten hat sich geändert?',cta:CTA_WEB,v:'photo',size:'xs'},
{k:'Realität 03',h:'80 % hören auf Stufe 2 zu<span class=lime>.</span>',s:'Stufe 2 heißt: auf die eigene Antwort warten. Die Pyramide des Zuhörens hat zehn Stufen. Die meisten Führungskräfte kennen nicht einmal die dritte.',cta:CTA_WEB,v:'dark',size:'s',num:'2',ph:'listening'},
{k:'Realität 04',h:'Du hast recht.<br>Und überzeugst trotzdem niemanden<span class=lime>.</span>',s:'Logos ist die Logik. Ethos die Glaubwürdigkeit. Pathos die Emotion. Wer nur Logos bringt, gewinnt die Diskussion und verliert den Raum.',cta:CTA_WEB,v:'lime',size:'xs'},
{k:'Realität 05',h:'„Meine Tür steht immer offen.“',s:'Heißt übersetzt: Ich warte, bis ihr kommt. Niemand kommt. Führung, die wartet, ist keine Führung.',cta:CTA_WEB,v:'dark',size:'s',ph:'solitude'},
{k:'Realität 06',h:'Niemand sagt dir, wenn du schlecht führst<span class=lime>.</span>',s:'Deine Mitarbeiter nicht. Dein Chef nicht. Dein Kalender schon: Er zeigt, welche Gespräche du seit Wochen verschiebst.',cta:CTA_WEB,v:'photo',size:'xs'},
{k:'Framework · Feedbackformel',h:'Drei Sätze.<br>Jedes schwierige Gespräch<span class=lime>.</span>',s:'',list:['Beobachtung: „Ich habe beobachtet, dass …“','Wirkung: „Dadurch …“','Wunsch: „Ich wünsche mir …“'],cta:CTA_WEB,v:'dark',size:'s',ph:'feedback'},
{k:'Framework · SEXIER',h:'Dein Argument hat fünf Schritte.<br><span class=lime>Es braucht sechs.</span>',s:'Statement, Explanation, eXample, Impact, Explanation of Impact. Und das R: Rebuttal. Die Gegenargumente widerlegen, bevor jemand sie ausspricht.',cta:CTA_WEB,v:'lime',size:'xs'},
{k:'Framework · 5 Rollen',h:'Du antwortest in der falschen Rolle<span class=lime>.</span>',s:'Kommunikator, Manager, Team-Leader, Psychologe, Problemlöser. Die meisten Führungsprobleme entstehen, weil jemand als Problemlöser auf eine Psychologen-Frage antwortet.',cta:CTA_WEB,v:'dark',size:'s',ph:'team'},
{k:'Framework · 4 Farben',h:'Ein Argument.<br>Ein Viertel des Raums<span class=lime>.</span>',s:'Rot will das Ergebnis. Gelb die Beziehung. Grün die Sicherheit. Blau die Daten. Wer immer gleich argumentiert, erreicht immer dieselben.',cta:CTA_WEB,v:'photo',size:'xs'},
{k:'Framework · Dunkle Rhetorik',h:'Strohmann. Ad hominem. Whataboutism<span class=lime>.</span>',s:'Du erlebst sie jede Woche im Meeting. Die Frage ist nur, ob du sie erkennst, bevor sie wirken. Die Antwort ist immer dieselbe: hart in der Sache, weich zur Person.',cta:CTA_WEB,v:'dark',size:'xs',ph:'negotiation'},
{k:'Framework · Charisma-Code',h:'Präsenz. Wärme. Kompetenz<span class=lime>.</span>',s:'Drei Signale, die in Sekunden entscheiden, ob ein Raum dir folgt. Jedes davon ist trainierbar. Keines davon ist Talent.',cta:CTA_WEB,v:'lime',size:'s'},
{k:'LeaderOS 01',h:'Ein Coach, der Wlads Bücher kennt.<br><span class=lime>24/7.</span>',s:'WladBot antwortet mit Wlads Frameworks, nicht mit Allgemeinplätzen. Vor dem Gespräch, nicht danach.',cta:CTA_TRIAL,v:'dark',size:'xs',av:'',ph:'boardroom-b'},
{k:'LeaderOS 02',h:'Üb das Gespräch,<br>bevor es zählt<span class=lime>.</span>',s:'Simulation: Du führst das Kündigungsgespräch, das Feedback, die Verhandlung. Mit einem Gegenüber, das zurückredet. Dann erst im echten Raum.',cta:CTA_TRIAL,v:'dark',size:'s',av:'',ph:'time'},
{k:'LeaderOS 03',h:'15 Minuten am Tag<span class=lime>.</span>',s:'Mehr braucht ein Drill nicht. Weniger bringt ein Seminar. Dreißig Tage davon verschieben Verhalten von „weiß ich“ zu „mache ich“.',cta:CTA_TRIAL,v:'lime',size:'h',av:''},
{k:'LeaderOS 04',h:'6 Grundlagen-Kurse.<br>4 Master-Programme<span class=lime>.</span>',s:'',list:['Rhetorik-Grundlagen','Schwierige Gespräche meistern','Delegation wie ein Profi','Feedback-Formate','Storytelling im Boardroom','Meeting-Rhetorik'],cta:CTA_TRIAL,v:'dark',size:'xs',ph:'app'},
{k:'LeaderOS 05',h:'Nicht noch ein Tool.<br><span class=lime>Ein System.</span>',s:'Kurse, KI-Coach, Simulationen, tägliche Drills. Nicht nebeneinander, sondern ineinander. Deshalb heißt es Operating System.',cta:CTA_TRIAL,v:'dark',size:'s',av:'',ph:'solitude'},
{k:'LeaderOS 06',h:'14 Tage.<br>Keine Karte.<br>Kein Risiko<span class=lime>.</span>',s:'Teste das System mit deinem echten nächsten Gespräch. Wenn es nichts verändert, hast du 14 Tage verloren. Wenn doch, ein Jahr gewonnen.',cta:CTA_TRIAL,v:'lime',size:'s',av:''},
{k:'Live-Webinar · 29. Oktober',h:'Live mit Wlad<span class=lime>.</span>',s:'Do, 29. Oktober, 10:00 bis 11:30 Uhr. Kostenlos. Keine Aufzeichnung, denn Live-Case und Q&A funktionieren nur live.',cta:CTA_WEB,v:'photo',size:'h'},
{k:'Live-Webinar · 29. Oktober',h:'Was in 90 Minuten passiert<span class=lime>.</span>',s:'',list:['Der Charisma-Code, live demonstriert','Das Leadership Operating System','Ein echter Live-Case aus der Community','Q&A: deine Fragen, direkt beantwortet'],cta:CTA_WEB,v:'dark',size:'s',ph:'stage'},
{k:'Live-Webinar · 29. Oktober',h:'Keine Auf&shy;zeichnung<span class=lime>.</span>',s:'Bewusst. Wer live dabei ist, bringt seinen Fall mit und bekommt seine Antwort. Eine Aufzeichnung kann beides nicht.',cta:CTA_WEB,v:'lime',size:'s'},
{k:'Live-Webinar · 29. Oktober',h:'3× SPIEGEL-Bestseller.<br>Seit 2007 im Coaching.<br>400.000+ Klienten<span class=lime>.</span>',s:'Zum ersten Mal zeigt Wlad Jachtchenko seine komplette Methodik als tägliches Trainingssystem. Live, kostenlos.',cta:CTA_WEB,v:'dark',size:'xs',ph:'presence'},
{k:'Live-Webinar · 29. Oktober',h:'Bring dein Gespräch mit<span class=lime>.</span>',s:'Das Feedback, die Verhandlung, der Konflikt. Im Q&A werden echte Fälle besprochen. Deiner kann dabei sein.',cta:CTA_WEB,v:'photo',size:'s'},
{k:'Live-Webinar · 29. Oktober',h:'Entweder du trainierst Führung.<br><span class=lime>Oder du hoffst.</span>',s:'Do, 29.10., 10 Uhr. 90 Minuten, die den Unterschied zwischen beidem zeigen. Kostenloser Platz: leader-os.de/webinar',cta:CTA_WEB,v:'dark',size:'xs',ph:'boardroom-b'},
];
const bg=(x)=>{
  if(x.v==='photo') return `<div class="bg photo" style="background-image:url('wlad-portrait.jpg');background-position:42% 30%;background-size:auto 1350px"></div>`;
  if(x.ph) return `<div class="bg photo" style="background-image:url('ph/${x.ph}.webp')"></div>`;
  return `<div class=bg></div>`;
};
document.body.innerHTML=S.map((x,i)=>`<section class="slide ${x.v==='lime'?'lime-bg':''} ${x.av!==undefined?'has-avatar':''}" data-i="${i+1}">
 ${bg(x)}<div class=bg2></div><div class=bg3></div><div class=bg4></div>
 ${x.av!==undefined?`<div class=halo></div><div class=ring></div><img class="avatar ${x.av}" src="avatar.png" alt="">`:''}
 ${x.num?`<div class=num>${x.num}</div>`:''}
 <div class=top><span class="mono lime">▸ ${x.k}</span><span class=mono style="opacity:.6">${String(i+1).padStart(2,'0')}/30</span></div>
 <div class=mid style="${x.v==='photo'?'margin-top:auto;margin-bottom:40px':''}">
  <h1 class="d h ${x.size||''}">${x.h}</h1>
  ${x.s?`<p class=sub>${x.s}</p>`:''}
  ${x.list?`<div class=list>${x.list.map((l,j)=>`<div><b>${String(j+1).padStart(2,'0')}</b><span>${l}</span></div>`).join('')}</div>`:''}
 </div>
 <div class=bot>
  <div class=wlad><img src="wlad-portrait.jpg" alt=""><span>Wlad Jachtchenko<br><span class=mono style="font-size:14px;letter-spacing:.16em">LeaderOS · leader-os.de</span></span></div>
  <span class=cta>${x.cta} →</span>
 </div>
</section>`).join('');
window.__COPY=S;
</script></body></html>
