<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>LinkedIn-Karussell F01 · Fenster · LeaderOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&family=Inter:wght@500;600&family=JetBrains+Mono:wght@400;700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<style>
/* F01 "Fenster" · fünf Folien · 1080×1350 (4:5) · Teaser für LeaderOS.
   Ein Portrait, fünfmal. Auf den Folien 1 bis 4 liegt ein scharfes, senkrechtes
   Fenster über der linken Gesichtshälfte, der Rest ist unscharf, dunkel und
   körnig, und wird von Folie zu Folie klarer (je öfter wiederholt, desto
   schärfer). Die Headline teilt sich links und rechts um das Fenster.
   Folie 5 zeigt das ganze Bild scharf, mit QR-Code und der Begrenzung.
   Kein Name auf den Folien (der Post kommt vom LinkedIn-Konto), keine
   Credentials. Fotoebenen und QR kommen aus build_assets.py (build/);
   die Fenstergeometrie unten muss mit WIN in diesem Skript übereinstimmen. */
:root{--lime:#bfff00;--ink:#0a0a0a;
  --disp:'Outfit',sans-serif;--body:'Inter',sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;--serif:'Instrument Serif',serif;
  --win-x:336px;--win-y:205px;--win-w:290px;--win-h:880px;--gap:28px;--pad:60px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#222}
.sheet{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--ink);color:#fff;font-family:var(--body)}
.photo{position:absolute;inset:0;width:100%;height:100%;display:block}
.shade{position:absolute;left:0;right:0;bottom:0;height:430px;background:linear-gradient(to top,rgba(0,0,0,.62),rgba(0,0,0,0))}

/* Dünner weißer Rahmen um das Fenster, wie in der Vorlage */
.frame{position:absolute;left:calc(var(--win-x) - 2px);top:calc(var(--win-y) - 2px);width:calc(var(--win-w) + 4px);height:calc(var(--win-h) + 4px);border:2px solid rgba(255,255,255,.92);pointer-events:none}

/* Mono-Annotationen oben, wie in den anderen Serien */
.tag{position:absolute;top:50px;font-family:var(--mono);font-size:18px;letter-spacing:.06em;color:rgba(255,255,255,.78);text-transform:lowercase;white-space:nowrap}
.tag.l{left:var(--pad)}
.tag.r{right:var(--pad)}

/* Geteilte Headline um das Fenster */
.hl{position:absolute;top:318px;font-family:var(--body);font-weight:600;font-size:52px;line-height:1.08;letter-spacing:-.022em;color:#fff;text-shadow:0 2px 26px rgba(0,0,0,.6),0 0 2px rgba(0,0,0,.25)}
.hl.l{right:calc(1080px - var(--win-x) + var(--gap));text-align:right}
.hl.r{left:calc(var(--win-x) + var(--win-w) + var(--gap));text-align:left}
.p,.d{color:var(--lime)}

/* Unten: Zeile in Serifenkursiv (Folie 1), Fließtext (2, 3) oder drei BIB-Zeilen (4) */
.serif{position:absolute;left:var(--pad);bottom:64px;font-family:var(--serif);font-style:italic;font-weight:400;font-size:70px;line-height:1.02;letter-spacing:-.01em;color:#fff;text-shadow:0 2px 24px rgba(0,0,0,.5)}
.body{position:absolute;left:var(--pad);right:var(--pad);bottom:72px;font-weight:500;font-size:34px;line-height:1.38;letter-spacing:-.003em;color:rgba(255,255,255,.86);text-shadow:0 2px 20px rgba(0,0,0,.5);text-wrap:balance}
.body b{font-weight:600;color:#fff}
.items{position:absolute;left:var(--pad);right:var(--pad);bottom:64px}
.it{display:flex;align-items:baseline;gap:22px;padding:11px 0;border-top:1px solid rgba(255,255,255,.24);font-weight:500;font-size:28px;line-height:1.3;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.5)}
.it:last-child{border-bottom:1px solid rgba(255,255,255,.24)}
.it i{font-style:normal;font-family:var(--mono);font-weight:700;font-size:17px;letter-spacing:.2em;color:var(--lime);flex:none}
.it i::before{content:'';display:inline-block;margin-right:12px;border-left:9px solid var(--lime);border-top:5.5px solid transparent;border-bottom:5.5px solid transparent}

/* Marke: lime Kachel (Favicon) und Wortmarke */
.brand{position:absolute;bottom:62px;display:flex;align-items:flex-end;gap:20px}
.brand.r{right:var(--pad)}
.brand.l{left:var(--pad);bottom:58px;gap:16px}
.brand .txt{text-align:right;padding-bottom:4px}
.brand.l .txt{text-align:left;padding-bottom:2px}
.wm{font-family:var(--disp);font-weight:700;font-size:44px;line-height:1;letter-spacing:-.03em;color:#fff;-webkit-text-stroke:.7px #fff}
.wm .d{-webkit-text-stroke:.7px var(--lime);margin:0 2px}
.beta{margin-top:12px;font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:.24em;color:var(--lime);text-transform:uppercase;white-space:nowrap}
.tile{width:88px;height:88px;display:block;flex:none;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}
.brand.l .tile{width:64px;height:64px}
.brand.l .wm{font-size:38px}

/* Folie 5: Begrenzung und QR-Code */
.cta-hl{position:absolute;left:var(--pad);top:826px;font-weight:600;font-size:70px;line-height:1.03;letter-spacing:-.03em;color:#fff;text-shadow:0 2px 26px rgba(0,0,0,.55)}
.seats{position:absolute;left:var(--pad);top:1066px}
.seats .g{display:grid;grid-template-columns:repeat(10,14px);gap:6px}
.seats .g span{display:block;width:14px;height:14px;background:var(--lime)}
.seats .c{margin-top:14px;font-family:var(--mono);font-size:15px;letter-spacing:.08em;color:rgba(255,255,255,.82);white-space:nowrap}
.qrcard{position:absolute;right:var(--pad);top:826px;width:392px;padding:32px 32px 22px;background:#fff;border-radius:26px;box-shadow:0 18px 60px rgba(0,0,0,.55)}
.qrcard img{display:block;width:328px;height:328px}
.qrcard .c{margin-top:18px;text-align:center;font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.2em;color:var(--ink);text-transform:uppercase}
.qrnote{position:absolute;right:var(--pad);top:1264px;width:392px;text-align:center;font-family:var(--mono);font-size:15px;letter-spacing:.08em;color:rgba(255,255,255,.82)}
</style>
</head>
<body>
<div id="sheet" class="sheet"></div>
<script>
// Die Zahl der Plätze muss der echten Begrenzung entsprechen: die Aufnahme
// stoppt bei dieser Zahl (technisch durchgesetzt), sonst ist die Knappheit
// erfunden und verstößt gegen docs/gtm/WEBINAR_FUNNEL.md. Gleiche Zahl wie
// SEATS in docs/gtm/linkedin-carousels-01/data.js.
const SEATS = 50;

const tag = (n, topic) => ({ tagL: `feldnotiz 09 · ${topic}`, tagR: `0${n} / 05` });

// Fakten nur aus docs/gtm/WLAD_CANON.md und den freigegebenen Serien-Texten.
const SLIDES = [
  { id: 'F01-01', photo: 'build/fenster-1.png', frame: true, ...tag(1, 'führung trainieren'), tagR: '01 / 05 · wischen →',
    left: 'Führung<br>wird nicht<br>gelernt.', right: 'Sie wird<br>trainiert<span class="p">.</span>',
    serif: 'Nach dem Seminar<br>ist vor dem Alltag.', brand: 'r' },
  { id: 'F01-02', photo: 'build/fenster-2.png', frame: true, ...tag(2, 'das muster'),
    left: 'Montag:<br>alle<br>motiviert.', right: 'Sechs Wochen<br>später: alles<br>beim Alten<span class="p">.</span>',
    body: 'Nach dem Seminar wissen alle, was zu tun ist. Das Problem ist nicht das Wissen. <b>Es hat nur niemand geübt.</b>' },
  { id: 'F01-03', photo: 'build/fenster-3.png', frame: true, ...tag(3, 'die methode'),
    left: 'Wie beim<br>Sport:', right: 'Wiederholen.<br>Am Ernstfall.<br>Mit Feedback<span class="p">.</span>',
    body: 'Niemand wird fit von einem Vortrag über Fitness. Führung ist eine Fähigkeit, und Fähigkeiten entstehen <b>durch Training.</b>' },
  { id: 'F01-04', photo: 'build/fenster-4.png', frame: true, ...tag(4, 'das system'),
    left: 'Training<br>als<br>System.', right: 'Das ist<br>Leader<span class="d">·</span>OS<span class="p">.</span>',
    items: [['01', 'KI-Coach, der die Methodik kennt'], ['02', 'Simulationen mit einem Gegenüber, das zurückredet'], ['03', '15 Minuten am Tag, am Fall von morgen']] },
  { id: 'F01-05', photo: 'build/fenster-5.png', frame: false, ...tag(5, 'jetzt'), cta: true },
];
window.SLIDES = SLIDES.map((s) => ({ id: s.id }));

const TILE = `<svg class="tile" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="fb" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#D4FF4D"/><stop offset="55%" stop-color="#BFFF00"/><stop offset="100%" stop-color="#A8E600"/></linearGradient></defs><rect width="32" height="32" rx="9.6" fill="url(#fb)"/><g transform="translate(4.2 4.2) scale(0.7375)" fill="none" stroke="#0A0A0A" stroke-linecap="round" stroke-linejoin="round"><path d="M2.8 4.8 L8.6 24.4 Q10 25.8 11.4 24.2 L15.4 9.8 Q16.4 8.8 17.4 9.8 L20.8 24.2 Q22.2 25.8 23.6 24.4 L28.8 4" stroke-width="3"/><path d="M28.8 4 Q30.2 4.6 29.6 6.4" stroke-width="2.6"/><circle cx="29.6" cy="6.4" r="1.2" fill="#0A0A0A" stroke="none"/></g></svg>`;
const brand = (side) => `<div class="brand ${side}">${side === 'r' ? '' : TILE}<div class="txt"><div class="wm">Leader<span class="d">·</span>OS</div>${side === 'r' ? '<div class="beta">Beta · kostenlos</div>' : ''}</div>${side === 'r' ? TILE : ''}</div>`;

function render(s, ig, seats) {
  let h = `<img class="photo" src="${s.photo}" alt="">`;
  if (!s.cta) h += '<div class="shade"></div>';
  if (s.frame) h += '<div class="frame"></div>';
  h += `<div class="tag l">${s.tagL}</div><div class="tag r">${s.tagR}</div>`;
  if (s.left) h += `<div class="hl l">${s.left}</div><div class="hl r">${s.right}</div>`;
  if (s.serif) h += `<div class="serif">${s.serif}</div>`;
  if (s.body) h += `<div class="body">${s.body}</div>`;
  if (s.items) h += `<div class="items">${s.items.map(([n, t]) => `<div class="it"><i>${n}</i><span>${t}</span></div>`).join('')}</div>`;
  if (s.brand) h += brand(s.brand);
  if (s.cta) {
    h += `<div class="cta-hl">Beta.<br>Kostenlos.<br>${seats > 0 ? `${seats} Plätze` : 'Jetzt starten'}<span class="p">.</span></div>`;
    if (seats > 0) h += `<div class="seats"><div class="g">${'<span></span>'.repeat(seats)}</div><div class="c">${seats} plätze insgesamt · aufnahme stoppt bei ${seats}</div></div>`;
    h += `<div class="qrcard"><img src="build/qr.svg" alt="QR-Code zum Beta-Zugang"><div class="c">scannen · beta starten</div></div>`;
    h += `<div class="qrnote">${ig ? 'oder Link in der Bio' : 'oder Link im ersten Kommentar'}</div>`;
    h += brand('l');
  }
  document.getElementById('sheet').innerHTML = h;
}

const q = new URLSearchParams(location.search);
// ?seats=0 rendert die Folie 5 ohne Begrenzung (Ersatz, solange die Aufnahme nicht technisch bei SEATS stoppt)
render(SLIDES[Number(q.get('s') || 0)], q.get('v') === 'ig', q.has('seats') ? Number(q.get('seats')) : SEATS);
</script>
</body>
</html>
