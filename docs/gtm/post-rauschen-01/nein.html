<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Nein · LeaderOS</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Einzelpost "Nein" · 1080×1350, mit ?f=story 1080×1920. Echtes Porträt hinter Milchglas, ein
   freigewischter Streifen zeigt die Augen. Aussage: Hinter einem Nein steckt ein Interesse.
   Kein erzeugtes Gesicht, keine KI-Schärfung: dasselbe Foto, einmal hinter Glas, einmal frei. */
:root{--ink:#1c1d1f;--serif:'Instrument Serif',Georgia,serif;--sans:'Inter Display','Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#222}
#sheet{position:relative;width:1080px;height:1350px;overflow:hidden;background:linear-gradient(160deg,#c9d3d4 0%,#e6e9e6 45%,#b9c6c9 100%);color:var(--ink);font-family:var(--serif)}
#sheet>*,#in>*{position:absolute}
.p{position:absolute;max-width:none;left:-410px;top:-70px;width:1900px;height:1900px}
.c{font:400 29px/1.3 var(--serif);letter-spacing:.06em;text-transform:uppercase;text-align:center;width:1080px;left:0}
.gr{inset:0;background:url(../social-kit/build/grain.png);opacity:.7;mix-blend-mode:overlay}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <filter id="glass" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".09" numOctaves="2" seed="4" result="n"/><feGaussianBlur in="SourceGraphic" stdDeviation="16" result="b"/><feDisplacementMap in="b" in2="n" scale="46" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="pebble"><feTurbulence type="fractalNoise" baseFrequency=".11" numOctaves="2" seed="9" result="n"/><feSpecularLighting in="n" surfaceScale="2.2" specularConstant=".9" specularExponent="18" lighting-color="#fff"><feDistantLight azimuth="235" elevation="52"/></feSpecularLighting></filter>
  <clipPath id="wipe"><path d="M118 468 C150 400 260 372 420 366 C560 360 720 352 800 372 C850 386 846 430 816 474 C790 520 700 548 610 558 C650 572 688 596 694 622 C696 650 640 660 580 652 C500 642 424 624 404 588 C300 590 190 580 140 548 C108 532 104 500 118 468 Z"/></clipPath>
</defs></svg>
<div id="sheet"><div id="in" style="left:0;top:0;width:1080px;height:1350px">
  <div style="left:-60px;top:-300px;width:1200px;height:2300px;filter:url(#glass)"><img class="p" src="../social-kit/build/portrait.png" style="left:-350px;top:230px"></div>
  <div style="left:0;top:-300px;width:1080px;height:2300px;background:rgba(232,238,238,.46)"></div>
  <div style="left:0;top:-300px;width:1080px;height:2300px;filter:url(#pebble);opacity:.5;mix-blend-mode:soft-light;background:#888"></div>
  <div style="left:0;top:0;width:1080px;height:1350px;clip-path:url(#wipe);background:#cdd5d5"><img class="p" src="../social-kit/build/portrait.png" style="filter:contrast(1.06) saturate(.92)"></div>
  <div style="left:0;top:0;width:1080px;height:1350px;clip-path:url(#wipe);box-shadow:inset 0 0 40px rgba(255,255,255,.55)"></div>
  <div style="left:0;top:60px;width:1080px;text-align:center;font:400 330px/1 var(--serif);letter-spacing:.03em;color:rgba(28,29,31,.86)">NEIN</div>
  <div class="c" style="top:850px">Hinter fast jedem Nein steckt ein Interesse.<br>Die meisten hören nur das Nein.<br>Übe die Rückfrage.</div>
  <div class="c" style="top:1060px;font-size:31px;display:flex;justify-content:space-between;padding:0 90px"><span>13/11/2026</span><span>leaderos.de</span><span>WLAD AI</span></div>
</div><div class="gr"></div></div>
<script>
if (new URLSearchParams(location.search).get('f') === 'story') { document.getElementById('sheet').style.height = '1920px'; document.getElementById('in').style.top = '290px'; }
</script>
</body>
</html>
