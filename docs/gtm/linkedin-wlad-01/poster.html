<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>LinkedIn-Poster · Wlad Jachtchenko</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* LinkedIn-Poster-Serie "Typo-Statement" · 1080×1350 (4:5).
   Recycelt die Ledger-Poster-Vorlage (große Wörter auf Linienraster,
   Mono-Annotationen, s/w-Foto unten rechts) in unserer DNA: Weiß/Schwarz,
   Outfit-Display, JetBrains-Mono-BIB-Codes, Lime nur als Punkt und Sticker.
   Aufbau: oben 4 bis 5 Zeilen Statement (automatisch auf Breite gesetzt,
   eine Größe für alle Zeilen), unten links der Textblock, unten rechts das
   Foto, der Sticker sitzt auf der Fotokante. */
:root{--ink:#0a0a0a;--paper:#ffffff;--rule:#d9d9d9;--mute:#6b6b6b;--lime:#bfff00;
  --disp:'Outfit',sans-serif;--body:'Inter',sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#333}
.sheet{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--body)}
/* Linienraster wie Kontobuch */
.rules{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0,transparent 107px,var(--rule) 107px,var(--rule) 108px);background-position:0 54px}
.margin{position:absolute;top:0;bottom:0;left:60px;width:1px;background:var(--rule)}
.frame{position:absolute;inset:36px;border:1px solid var(--ink);pointer-events:none}
/* Mono-Annotationen */
.a{position:absolute;font-family:var(--mono);font-size:17px;line-height:1.3;color:var(--ink);letter-spacing:.01em;white-space:nowrap}
.a.m{color:var(--mute)}
.a.r{text-align:right}
/* Die Zeilen · Bereich y 104–824 */
.rows{position:absolute;left:0;right:0;top:104px;height:720px}
.row{position:relative}
.w{position:absolute;top:0;font-family:var(--disp);font-weight:800;line-height:1;letter-spacing:-.05em;color:var(--ink);white-space:nowrap}
.w.left{left:76px}
.w.right{right:76px}
.w .p{color:var(--lime)}
.row .a{bottom:6px}
/* Textblock + Foto */
.body{position:absolute;left:76px;top:876px;width:480px;font-size:23px;line-height:1.45;color:#2a2a2a;font-weight:400}
.body b{font-weight:600;color:var(--ink)}
.photo{position:absolute;right:0;bottom:0;width:430px;height:520px;overflow:hidden;background:#111}
.photo img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.08)}
/* Sticker auf der Fotokante (ersetzt "have a good day") */
.sticker{position:absolute;left:566px;top:808px;width:150px;height:150px;border-radius:999px;background:var(--lime);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);z-index:2}
.sticker b{font-family:var(--disp);font-weight:800;font-size:54px;line-height:1;letter-spacing:-.04em}
.sticker span{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;margin-top:6px;text-align:center;line-height:1.3;max-width:120px}
.foot{position:absolute;left:76px;bottom:56px;font-family:var(--mono);font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
</style>
</head>
<body>
<div id="sheet" class="sheet"></div>
<script>
// Fünf Statements. Jede Zeile: [Wort(e), Ausrichtung, Annotation (gegenüber), Nummer, letzteZeile]
// Fakten nur aus docs/gtm/WLAD_CANON.md (seit 2007, 400.000+ Klienten, 3× SPIEGEL-Bestseller).
const TOP = 'wlad jachtchenko · leadership-coach seit 2007';
const POSTS = [
  {
    id: 'LI·01', photo: '../../../frontend/public/journal/topics/training-b.webp',
    rows: [
      ['Wissen', 'left', null, '(01)'],
      ['wird gelehrt.', 'right', 'seminar · folien · vergessen', null],
      ['Verhalten', 'left', null, '(02)'],
      ['wird trainiert', 'right', 'nochmal lesen (←)', null, true],
    ],
    body: 'Nach jedem Seminar wissen alle, was zu tun ist. Sechs Wochen später ist das Verhalten das alte. Nicht, weil die Leute es nicht verstanden hätten. <b>Weil niemand trainiert hat.</b> Führung ist eine Fähigkeit. Fähigkeiten entstehen durch Wiederholung, nicht durch Folien.',
    sticker: ['W.', 'Führung trainieren'],
    foot: 'Wlad Jachtchenko · seit 2007 · 400.000+ Klienten',
    top: [TOP, 'leadership · 2026'],
  },
  {
    id: 'LI·02', photo: '../../../frontend/public/journal/topics/listening.webp',
    rows: [
      ['Rede', 'left', null, '(01)'],
      ['weniger.', 'right', 'stufe 1: nicht zuhören', null],
      ['Frage', 'left', null, '(02)'],
      ['mehr', 'right', 'stufe 10: stille', null, true],
    ],
    body: 'Zuhören hat zehn Stufen. Stufe 1: nicht zuhören. Stufe 2: <b>auf die eigene Antwort warten.</b> Dort bleiben die meisten Führungskräfte hängen, ein Leben lang. Ganz oben, auf Stufe 10, ist Stille selbst die Antwort. Der Weg dorthin beginnt mit einer Frage mehr und einem Satz weniger.',
    sticker: ['10', 'Stufen des Zuhörens'],
    foot: 'Wlad Jachtchenko · die 10 Stufen des Zuhörens',
    top: [TOP, 'aus: weiße rhetorik'],
  },
  {
    id: 'LI·03', photo: '../../../frontend/public/journal/topics/feedback.webp',
    rows: [
      ['Nie:', 'left', null, '(01)'],
      ['du bist.', 'right', 'urteil über die person', null],
      ['Immer:', 'left', null, '(02)'],
      ['ich sehe', 'right', 'beobachtung · wirkung · wunsch', null, true],
    ],
    body: 'Die Feedbackformel hat drei Teile: <b>Beobachtung, Wirkung, Wunsch.</b> „Ich habe gesehen, dass du im Meeting dreimal unterbrochen hast. Auf das Team wirkt das, als zählten ihre Punkte nicht. Ich wünsche mir, dass du ausreden lässt." Drei Sätze. Kein Urteil über den Menschen, nur über die Situation.',
    sticker: ['B·W·W', 'Feedbackformel'],
    foot: 'Wlad Jachtchenko · die Feedbackformel',
    top: [TOP, 'skript für schwierige gespräche'],
  },
  {
    id: 'LI·04', photo: '../../../frontend/public/journal/topics/boardroom.webp',
    rows: [
      ['Behaupten', 'left', null, '(01)'],
      ['reicht nicht.', 'right', 'statement', null],
      ['Begründe', 'left', null, '(02)'],
      ['in sechs', 'right', 'explanation · example', null],
      ['Schritten', 'left', 'impact · rebuttal', null, true],
    ],
    body: 'Ein vollständiges Argument hat sechs Schritte: <b>Statement, Explanation, Example, Impact, Explanation of Impact, Rebuttal.</b> Die meisten hören nach dem ersten auf und wundern sich, dass niemand folgt. Wer alle sechs geht, muss nicht lauter werden. Das SEXIER-Modell aus „Weiße Rhetorik".',
    sticker: ['6', 'Schritte · SEXIER'],
    foot: 'Wlad Jachtchenko · 3× SPIEGEL-Bestseller',
    top: [TOP, 'aus: weiße rhetorik'],
  },
  {
    id: 'LI·05', photo: '../../../frontend/public/wlad/wlad-portrait.jpg', pos: '68% 10%',
    rows: [
      ['Führung', 'left', null, '(01)'],
      ['ist', 'right', 'keine frage des talents', null],
      ['trainierbar.', 'left', null, '(02)'],
      ['Wie Fitness', 'right', 'kostenlos · testgruppe · begrenzt', null, true],
    ],
    body: 'Niemand wird fit von einem Vortrag über Fitness. Führung funktioniert genauso: 15 Minuten am Tag, am echten Fall, mit Feedback. Genau dafür haben wir LeaderOS gebaut. <b>Für eine kleine Testgruppe öffnen wir den Zugang jetzt kostenlos.</b> Link im ersten Kommentar.',
    sticker: ['50', 'Plätze · Testgruppe'],
    foot: 'Wlad Jachtchenko · LeaderOS · Testgruppe',
    top: ['kostenloser zugang · begrenzte testgruppe', 'leader-os.de'],
  },
];

const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const AVAIL = 1080 - 2 * 76;   // Breite zwischen den Rändern
const BASE = 196;              // Maximalgröße der Wörter

function render(i) {
  const p = POSTS[i];
  const n = p.rows.length;
  const rowH = Math.floor(720 / n);
  const rows = p.rows.map(([word, side, ann, num, last]) => {
    const dot = last ? '<span class="p">.</span>' : '';
    // Annotation und Nummer stehen auf der Seite, die das Wort frei lässt.
    const other = side === 'left' ? 'right:76px' : 'left:76px';
    const annHtml = ann ? `<div class="a m" style="${other}">${esc(ann)}</div>` : '';
    const numHtml = num ? `<div class="a" style="${other}">${esc(num)}</div>` : '';
    return `<div class="row" style="height:${rowH}px"><div class="w ${side}">${esc(word)}${dot}</div>${annHtml}${numHtml}</div>`;
  }).join('');
  const pos = p.pos ? `style="object-position:${p.pos}"` : '';
  document.getElementById('sheet').innerHTML = `
    <div class="rules"></div><div class="margin"></div><div class="frame"></div>
    <div class="a m" style="left:76px;top:52px">${esc(p.top[0])}</div>
    <div class="a r" style="right:76px;top:52px">${esc(p.id)} · ${esc(p.top[1])}</div>
    <div class="rows">${rows}</div>
    <div class="body">${p.body}</div>
    <div class="photo"><img src="${p.photo}" ${pos} alt=""></div>
    <div class="sticker"><b>${esc(p.sticker[0])}</b><span>${esc(p.sticker[1])}</span></div>
    <div class="foot">${esc(p.foot)}</div>`;
  document.title = `${p.id} · LinkedIn-Poster`;
  fit(rowH);
}

/* Eine Schriftgröße für alle Zeilen: so groß wie möglich, aber jede Zeile
   passt zwischen die Ränder und in die Zeilenhöhe. */
function fit(rowH) {
  const words = Array.from(document.querySelectorAll('.w'));
  let size = Math.min(BASE, Math.floor(rowH * 0.92));
  words.forEach((w) => { w.style.fontSize = size + 'px'; });
  const widest = Math.max(...words.map((w) => w.getBoundingClientRect().width));
  if (widest > AVAIL) size = Math.floor(size * (AVAIL / widest));
  words.forEach((w) => {
    w.style.fontSize = size + 'px';
    // Wort optisch in der Zeile zentrieren (Versalhöhe sitzt oben)
    w.style.top = Math.max(0, Math.floor((rowH - size * 0.98) / 2) - 6) + 'px';
  });
}

const idx = Number(new URLSearchParams(location.search).get('i') || 0);
document.fonts.ready.then(() => render(Math.min(POSTS.length - 1, Math.max(0, idx))));
window.POSTS = POSTS;
</script>
</body>
</html>
